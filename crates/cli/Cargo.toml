[package]
name = "clank"
version = "0.0.1"
edition = "2024"

[dependencies]
# Shared terminal width and grapheme boundaries for icons and row layout.
unicode-width = "0.2"
unicode-segmentation = "1"

tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
# github polling transport (github-http-client-and-realtime M1):
# typed statuses/headers instead of parsing gh CLI output. rustls, no
# default features — no openssl linkage.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
# the realtime relay's loopback listener (M2): hyper serves the
# gh-webhook forwarder's deliveries on 127.0.0.1 only.
hyper = { version = "1", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
# Help sections wrap to the same width clap measures.
terminal_size = "0.4"

# File watcher
notify = "8"
notify-debouncer-full = "0.6"

# Gitignore matching for the worktree watcher's wake filter.
ignore = "0.4"

# SIGWINCH forwarding for the event-driven TUI.


signal-hook = "0.3"

# Hashing
blake3 = "1"
# Only to serve the vendored decoder compressed: 251 KiB of it, 56 on
# the wire (see `../web/assets/vendor/README.md`).
flate2 = "1"

# Path canonicalization
dunce = "1"

# Shared core types (closed-vocab enums, identifiers, response DTOs).
clank-core = { path = "../core", features = ["cache-encoding"] }
clank-web = { path = "../web" }
clank-web-cloudflare = { path = "../web-cloudflare" }
clank-user-config = { path = "../user-config" }
wincode = { version = "0.5", features = ["derive"] }

# JSON
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }

# Words as a shell splits them: a hook entry is recognised by the
# program its command runs, quoted or not.
shell-words = "1"

# SIGPIPE reset
libc = "0.2"

# Errors / logging
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Atomic file writes (clank feedback write).
tempfile = "3"

# Markdown -> HTML for clank html.
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }

# Syntax highlighting for clank html diffs. `default-fancy`
# brings in the compiled-in default grammar set + the no-onig
# regex backend (pure Rust) so we don't pull in `onig` and
# `libclang`. CSS-class output mode keeps theming in our
# stylesheet — we don't ship a syntect theme.
syntect = { version = "5", default-features = false, features = ["default-fancy"] }

# RFC3339 timestamp formatting for AgentConfig.session.updated_at.
# UTC only — local-offset has soundness issues in multi-threaded programs.
time = { version = "0.3", features = ["formatting", "parsing"] }

# `which` for the doctor's `cfg.launch.command on $PATH?` check.
# Small + pure-Rust + cross-platform.
which = "7"

# Programmatic git access. Backend for `git_io.rs` migration off
# shell-out + text-parse (plan: replace-git-io-with-gix). Features
# are tight: revision/blob-diff are the migration targets, the
# perf+parallel features are trim-first if binary size grows.
gix = { version = "0.84", default-features = false, features = [
    "sha1",                  # required: at least one hash backend
    "revision",              # rev_parse, rev_walk, merge_base
    "blob-diff",             # diff_tree_to_tree with rename detection
    "status",                # in-process worktree status (dirty_stats); pulls dirwalk+index
    "excludes",              # Repository::excludes: git-accurate ignore check (nested .gitignore) for the status watch filter
    "tree-editor",           # edit_tree: build stripped trees for the rewrite engine
    "merge",                 # merge_trees: replay a commit's change onto another tree in memory (squash reordering)
    "max-performance-safe",  # zlib-rs + parallel without C deps
    "parallel",              # Repository: Send under parallel feature
] }
kdl = "4"
# The remote's door (the-way-in-is-a-token): a QR of the phone's
# link, and the random, encoded, constant-time-compared credentials
# behind the token and the sessions it opens.
qrcode = { version = "0.14", default-features = false }
# Parsing the tunnel's public URL into the host its lease is keyed by.
url = "2"
getrandom = "0.3"
base64 = "0.22"
# Ed25519 verification of user-command requests; already in the lock via rustls.
ring = "0.17"
subtle = "2"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# The accountless tunnel: an ephemeral *.trycloudflare.com, no
# account and no binary. Its edge buffers streamed responses, which
# is why the page's live channel has a long-poll mode.
cloudflare-quick-tunnel = "0.3"
# The page's live channel is a WebSocket, because the accountless
# tunnel's edge buffers a response body until it completes and so
# never delivers a stream — an upgrade is not a body (measured).
hyper-tungstenite = "0.30"
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
hickory-resolver = "0.24"
hickory-client = "0.24"

[[bin]]
name = "clank"
path = "src/main.rs"
# The bin holds no tests (the README tests live in the lib), so its
# test target is one fewer binary to link and assess.
test = false

# The TUI starts this sibling process. Installing `clank` must install
# the host too, rather than relying on a separately built workspace bin.
[[bin]]
name = "clank-web-cloudflare"
path = "src/bin/clank-web-cloudflare.rs"
test = false

[build-dependencies]
sha2 = "0.11"

[dev-dependencies]
# test-only: the root set clank's rustls clients bundle, read by the
# tls_trust gate so an incident root cannot return unnoticed.
webpki-roots = "1.0.10"
clank-web-cloudflare = { path = "../web-cloudflare", features = ["test-support"] }
clank-user-config = { path = "../user-config", features = ["test-hooks"] }
# Only to answer a handshake by hand in the live connector test.
sha1 = "0.11.0"
# test-only: the vendored assets are checked against the digest their
# registry publishes, which is a sha256 (see ../web/assets/vendor/README.md).
sha2 = "0.11"
# test-only: the pages the binary ships are PARSED, so a script that
# cannot run cannot ship (a-page-that-does-not-parse-is-not-a-page).
# A parser, not an engine: no DOM, no fetch, nothing to execute.
oxc_allocator = "0.151"
oxc_parser = "0.151"
oxc_span = "0.151"
oxc_semantic = "0.151"
# test-only: a JS engine, so the decisions the pages make about the
# credential are RUN by `cargo test` rather than read by a reviewer.
# Chosen on cost against boa_engine: 3s vs 16s clean build, 12 vs 319
# dependency-tree lines. No runtime beyond Rust and a C compiler, which
# the toolchain already needs (the-pages-logic-can-be-tested).
rquickjs = "0.14"
filetime = "0.2"
# test-only: book_is_true matches book/scrub-patterns.txt, which the
# Python recorder also reads; fancy-regex accepts the lookarounds and
# backreferences Python's `re` does, and syntect already builds it.
fancy-regex = "0.16"
# test-only: the source gates read each file's module tree from the
# parse, so a comment or string that looks like `mod x;` includes nothing.
syn = { version = "2", features = ["full", "visit"] }
quote = "1"
# test-only: line numbers for what the parsed-source gates report.
proc-macro2 = { version = "1", features = ["span-locations"] }
# test-only: paused-time (`start_paused`) so the github poll loop's
# inter-tick sleeps resolve instantly in tests (extra-wait-events).
tokio = { version = "1", features = ["test-util"] }
