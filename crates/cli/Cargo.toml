[package]
name = "clank"
version = "0.0.1"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive", "env"] }

# File watcher
notify = "8"
notify-debouncer-full = "0.6"

# Hashing
blake3 = "1"

# Path canonicalization
dunce = "1"

# Shared core types (closed-vocab enums, identifiers, response DTOs).
clank-core = { path = "../core", features = ["cache-encoding"] }
wincode = { version = "0.5", features = ["derive"] }

# JSON
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# SIGPIPE reset
libc = "0.2"

# Errors / logging
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Atomic file writes (clank feedback write).
tempfile = "3"

# Markdown -> HTML for clank html.
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }

# Syntax highlighting for clank html diffs. `default-fancy`
# brings in the compiled-in default grammar set + the no-onig
# regex backend (pure Rust) so we don't pull in `onig` and
# `libclang`. CSS-class output mode keeps theming in our
# stylesheet — we don't ship a syntect theme.
syntect = { version = "5", default-features = false, features = ["default-fancy"] }

# RFC3339 timestamp formatting for AgentConfig.session.updated_at.
# UTC only — local-offset has soundness issues in multi-threaded programs.
time = { version = "0.3", features = ["formatting"] }

[dev-dependencies]
filetime = "0.2"
