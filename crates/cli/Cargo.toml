[package]
name = "clank"
version = "0.0.1"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive", "env"] }

# File watcher
notify = "8"
notify-debouncer-full = "0.6"

# Hashing
blake3 = "1"

# Path canonicalization
dunce = "1"

# Shared core types (closed-vocab enums, identifiers, response DTOs).
clank-core = { path = "../core", features = ["cache-encoding"] }
wincode = { version = "0.5", features = ["derive"] }

# JSON
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Errors / logging
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
filetime = "0.2"
