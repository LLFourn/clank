<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>clank · sign in</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #1a1917; color: #e8e4dc; font: 16px/1.5 ui-monospace, "SF Mono", Menlo, monospace; }
  main { width: min(30rem, calc(100vw - 2rem)); padding: 1.5rem; background: #242220; border-radius: 6px; }
  h1 { margin: 0 0 .25rem; font-size: 1.1rem; font-weight: 700; }
  p.lede { margin: 0 0 1.25rem; color: #8a857c; }
  label { display: block; color: #8a857c; }
  input { display: block; width: 100%; box-sizing: border-box; margin: .35rem 0 1rem; padding: .7rem; border: 1px solid #3a3835; border-radius: 4px; background: #1a1917; color: inherit; font: inherit; letter-spacing: .04em; }
  input:focus { outline: 2px solid #e0a458; outline-offset: 1px; }
  button { width: 100%; padding: .75rem; border: 0; border-radius: 4px; background: #e0a458; color: #1a1917; font: inherit; font-weight: 700; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  p.say { margin: 1rem 0 0; color: #8a857c; }
  p.say.bad { color: #e07070; }
</style>
</head>
<body>
<main>
  <h1>clank</h1>
  <p class="lede">Paste the token from the remote page in your clank TUI.</p>
  <form id="f">
    <label for="token">Token</label>
    <input id="token" name="token" type="password" autocomplete="off" autocapitalize="off"
           autocorrect="off" spellcheck="false" required>
    <button id="go" type="submit">Sign in</button>
  </form>
  <p class="say" id="say"></p>
</main>
<script>
(() => {
  const say = document.getElementById('say'), go = document.getElementById('go');
  const form = document.getElementById('f'), token = document.getElementById('token');
  if (new URLSearchParams(location.search).get('why') === 'link') {
    say.textContent = 'That link is spent or expired. Paste the token instead, or mint a new link from the TUI.';
    say.className = 'say bad';
  }
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const value = token.value.trim();
    if (!value) return;
    go.disabled = true; say.className = 'say'; say.textContent = 'Checking…';
    try {
      const r = await fetch('/login', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ token: value }),
      });
      if (!r.ok) throw new Error(await r.text());
      location.replace('/');
    } catch (err) {
      say.textContent = err.message || String(err);
      say.className = 'say bad';
      go.disabled = false;
      token.select();
    }
  });
  token.focus();
})();
</script>
</body>
</html>
