<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>clank</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Martian+Mono:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.min.css">
<script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"></script>
<style>
  :root {
    --base: #faf9f7;
    --bezel: #f1efe9;
    --edge: #e3ded4;
    --ink: #262420;
    --muted: #6a655c;
    --hue: #5f5fff;
    /* The state hues were picked to glow on a dark ground. Anything
       that must carry TEXT — a filled button — takes them mixed
       toward the ink instead, or a yellow `reviewing` lamp puts pale
       letters on pale yellow. */
    --hue-deep: color-mix(in srgb, var(--hue) 58%, #17150f);
    --mono: ui-monospace, Menlo, "SF Mono", Consolas, monospace;
    --text: ui-sans-serif, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --plate: "Martian Mono", var(--mono);
    /* The terminal keeps its own ground at every width: agents choose
       ANSI colours assuming a dark one, and bright-white-on-white is
       not something CSS out here can fix. */
    --pane: #1a1917;
    --pane-ink: #e8e4dc;
  }
  * { box-sizing: border-box; }
  /* A grid item's `min-width: auto` is its CONTENT's minimum, so one
     unshrinkable row — the composer, with its buttons — widens the
     whole column and pushes Send off a 320px screen (codex on
     a757522). Every area here scrolls or truncates internally. */
  body > * { min-width: 0; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--base); color: var(--ink);
    font: 14px/1.5 var(--text);
    display: grid;
    grid-template-rows: auto auto 1fr auto;
    grid-template-columns: 1fr;
    grid-template-areas: "bar" "strip" "agent" "say";
    overflow: hidden;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; text-align: left; }
  button:focus-visible { outline: 2px solid var(--hue); outline-offset: -2px; }

  /* The header: the shown agent, said once, and what it owes. */
  .bar {
    grid-area: bar; position: relative;
    display: grid; grid-template-columns: minmax(0, 1fr) auto;
    padding: 6px 14px 8px;
  }
  .bar .who { display: inline-flex; align-items: baseline; gap: 7px; padding: 6px 2px 6px 0; margin: -6px 0; max-width: 100%; }
  .bar .who .name { font-family: var(--plate); font-weight: 700; font-size: 22px; letter-spacing: -0.02em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar .who .caret { color: var(--muted); font-size: 13px; }
  /* Pinned, with the turn somewhere else: the one thing the header
     cannot say when it is showing a name of your choosing. */
  .bar .who .away { display: none; width: 7px; height: 7px; border-radius: 50%; background: var(--hue); animation: breathe 2.4s ease-in-out infinite; }
  .bar .who.elsewhere .away { display: inline-block; }
  .bar .who .tag { color: var(--muted); font-size: 11px; }
  .bar .more { grid-column: 2; min-width: 44px; min-height: 44px; margin: -8px -12px 0 0; font-size: 20px; letter-spacing: 2px; color: var(--ink); display: inline-flex; align-items: center; justify-content: center; }
  .state { grid-column: 1 / -1; display: flex; align-items: baseline; gap: 14px; margin-top: 1px; }
  .state .doing { flex: 1 1 auto; min-width: 0; color: var(--muted); font-size: 12px; }
  .doing { display: flex; align-items: baseline; gap: 9px; }
  .doing .said { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .doing .obj { color: var(--ink); }
  .doing .clock { flex: 0 0 auto; font-family: var(--plate); font-weight: 700; color: var(--ink); }
  .state .doing .dot, .picker .doing .dot {
    display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: var(--hue); margin-right: 7px; vertical-align: 1px;
    animation: breathe 2.4s ease-in-out infinite;
  }
  .state .modes { flex: 0 0 auto; display: flex; gap: 11px; font-size: 12px; }
  .state .modes button { color: var(--muted); padding: 2px 0; border-bottom: 2px solid transparent; }
  .state .modes button.on { color: var(--ink); border-bottom-color: var(--ink); }
  .state .modes button:disabled { opacity: 0.4; cursor: default; }
  @keyframes breathe { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
  @media (prefers-reduced-motion: reduce) { .dot, .away { animation: none; } }

  /* The picker: every agent, and `auto` — whoever's turn it is. */
  .picker {
    position: absolute; top: 100%; left: 0; right: 0; z-index: 4;
    background: var(--bezel); border-top: 1px solid var(--edge); border-bottom: 1px solid var(--edge);
    box-shadow: 0 18px 44px rgba(0, 0, 0, .5);
    max-height: 62vh; overflow: auto;
  }
  .picker .opt { display: block; width: 100%; padding: 9px 14px 10px; border-bottom: 1px solid var(--edge); border-left: 3px solid transparent; }
  .picker .opt:last-child { border-bottom: 0; }
  .picker .opt[aria-selected="true"] { border-left-color: var(--hue); }
  .picker .opt .nm { font-family: var(--plate); font-weight: 700; font-size: 15px; }
  .picker .opt .role { color: var(--muted); font-size: 11px; margin-left: 8px; }
  .picker .opt .doing { color: var(--muted); font-size: 12px; margin-top: 2px; }

  /* An interruption, not chrome: here while it is true, gone after. */
  .strip { grid-area: strip; padding: 9px 14px; background: color-mix(in srgb, var(--hue) 13%, var(--bezel)); border-top: 1px solid var(--edge); border-bottom: 1px solid var(--edge); font-size: 12px; white-space: pre-wrap; }
  .strip .how { display: block; color: var(--muted); margin-top: 3px; }

  /* One agent. */
  .agent { grid-area: agent; display: grid; min-height: 0; border-top: 1px solid var(--edge); }
  .views { position: relative; min-height: 0; }
  .view { position: absolute; inset: 0; overflow: auto; display: none; }
  .view.on { display: block; }
  .empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--muted); padding: 24px; text-align: center; }

  /* Transcript: turns in a column. The agent's are plain; what the
     person said sits in a block of its own, so who is speaking needs
     no label. How long ago is the one thing worth a mark, at the
     right edge of every turn. */
  .turns { padding: 18px 20px 28px; max-width: 68ch; margin-inline: auto; font-size: 16px; line-height: 1.62; }
  .turn { position: relative; padding: 10px 0; }
  .turn .age { float: right; margin: 4px 0 0 12px; color: var(--muted); font-size: 11px; font-family: var(--mono); }
  /* What the person said is a block of its own, so who is speaking
     needs no label. */
  .turn.person { margin: 14px 0; padding: 12px 14px; background: var(--bezel); border: 1px solid var(--edge); border-radius: 10px; }
  .turn .text { overflow-wrap: anywhere; }
  .turn.harness .text { color: var(--muted); font-size: 13px; }
  .turn.thinking .text { color: var(--muted); }

  /* Rendered prose. `render_markdown` is the only thing allowed to
     produce this markup; it escapes raw HTML and refuses a
     destination whose scheme is not on its list. */
  .prose > :first-child { margin-top: 0; }
  .prose > :last-child { margin-bottom: 0; }
  .prose p, .prose ul, .prose ol, .prose blockquote, .prose table { margin: 0 0 0.85em; }
  .prose h1, .prose h2, .prose h3, .prose h4 { margin: 1.4em 0 0.5em; line-height: 1.25; font-weight: 650; }
  .prose h1 { font-size: 1.4em; }
  .prose h2 { font-size: 1.22em; }
  .prose h3 { font-size: 1.08em; }
  .prose h4 { font-size: 1em; }
  .prose ul, .prose ol { padding-left: 1.4em; }
  .prose li { margin: 0.25em 0; }
  .prose blockquote { margin-left: 0; padding: 0.1em 0 0.1em 1em; border-left: 3px solid var(--edge); color: var(--muted); }
  .prose a { color: var(--hue-deep); text-underline-offset: 2px; }
  .prose code { font-family: var(--mono); font-size: 0.86em; background: var(--bezel); border: 1px solid var(--edge); border-radius: 4px; padding: 0.1em 0.32em; }
  .prose pre { margin: 0 0 0.9em; padding: 10px 12px; background: var(--bezel); border: 1px solid var(--edge); border-radius: 8px; overflow-x: auto; }
  .prose pre code { font-size: 0.85em; background: none; border: 0; padding: 0; }
  .prose table { border-collapse: collapse; display: block; overflow-x: auto; }
  .prose th, .prose td { border: 1px solid var(--edge); padding: 4px 9px; text-align: left; }
  .prose hr { border: 0; border-top: 1px solid var(--edge); margin: 1.2em 0; }
  .prose img { max-width: 100%; border-radius: 6px; }

  /* What was DONE, one tap from what was said: a run of tool calls
     with no prose between them is one row. */
  .did { margin: 4px 0 10px; }
  .did > summary, .turn.tool details > summary { cursor: pointer; list-style: none; color: var(--muted); font-family: var(--mono); font-size: 13px; padding: 3px 0; }
  .did > summary::-webkit-details-marker, .turn.tool summary::-webkit-details-marker { display: none; }
  .did > summary::before { content: "▸ "; }
  .did[open] > summary::before { content: "▾ "; }
  .did .members { padding-left: 14px; border-left: 1px solid var(--edge); margin-left: 3px; }
  .turn details summary { cursor: pointer; list-style: none; color: var(--muted); font-family: var(--mono); font-size: 13px; }
  .turn details summary::before { content: "▸ "; }
  .turn details[open] summary::before { content: "▾ "; }
  .turn .tool .name { color: var(--ink); }
  .turn pre { margin: 6px 0 0; padding: 8px 10px; background: var(--bezel); border: 1px solid var(--edge); border-radius: 6px; white-space: pre-wrap; overflow-wrap: anywhere; font-family: var(--mono); font-size: 12px; max-height: 40vh; overflow: auto; }
  /* A picture, as pasted: no wider than the column, no taller than
     most of the screen; the full thing a tap away. */
  .turn .shot { display: block; max-width: 100%; max-height: 60vh; margin: 6px 0 0; border-radius: 6px; border: 1px solid var(--edge); cursor: zoom-in; }
  .turn .shots { margin-top: 6px; }
  .turn .unshipped { color: var(--muted); font-size: 12px; }
  /* The full picture, in the page: a browser will not open a data
     URL as a page of its own, so the viewer is ours — natural size,
     scrollable, gone on a tap or Escape. */
  .viewer { display: none; position: fixed; inset: 0; z-index: 6; background: rgba(0, 0, 0, .88); overflow: auto; cursor: zoom-out; }
  .viewer.open { display: block; }
  .viewer img { display: block; margin: 24px auto; max-width: none; }
  .turn pre[hidden] { display: none; }

  /* Terminal: the pane at its desktop size, in a scroller. */
  .terminal { -webkit-overflow-scrolling: touch; touch-action: pan-x pan-y pinch-zoom; padding: 6px 0 0 6px; background: var(--pane); color: var(--pane-ink); }
  .terminal .term { width: max-content; }
  .terminal .gone { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; color: var(--pane-ink); background: color-mix(in srgb, var(--pane) 78%, transparent); }
  .terminal.closed .gone { display: flex; }

  /* Say something. */
  .say { grid-area: say; display: flex; gap: 8px; padding: 8px 10px calc(8px + env(safe-area-inset-bottom)); background: var(--bezel); border-top: 1px solid var(--edge); }
  .say input { flex: 1 1 0; min-width: 0; background: var(--base); color: var(--ink); border: 1px solid var(--edge); border-radius: 6px; padding: 10px 12px; font: 15px var(--text); }
  .say input:focus { outline: 2px solid var(--hue); outline-offset: -1px; border-color: transparent; }
  .say button.send { background: var(--hue-deep); color: #fff; border-radius: 6px; padding: 0 16px; font-weight: 700; }
  /* Beside Send, never instead of it: whether an agent is working is
     evidence, not a fact, and no amount of doubt should leave a person
     unable to speak. */
  .say button.stop { background: none; color: var(--ink); border: 1px solid var(--edge); border-radius: 6px; padding: 0 12px; }
  .say button.attach { min-width: 40px; font-size: 21px; line-height: 1; color: var(--muted); display: inline-flex; align-items: center; justify-content: center; }
  .say button.send:disabled { opacity: 0.4; cursor: default; }
  .say .sent { color: var(--muted); font-size: 12px; align-self: center; white-space: nowrap; }

  /* The ledger: a drawer on a phone, a column on a desk. */
  .ledger { display: none; background: var(--bezel); border-left: 1px solid var(--edge); overflow: auto; font-size: 13px; }
  .ledger.open { display: block; position: fixed; inset: 0; z-index: 2; border: 0; }
  .ledger .lhead { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 10px 14px 8px; }
  .ledger .lhead .session { font-family: var(--plate); font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ledger .close { color: var(--muted); }
  .ledger .facts { padding: 6px 14px 10px; border-bottom: 1px solid var(--edge); }
  .ledger .facts .plan { font-family: var(--plate); font-weight: 700; }
  .ledger .facts .gate { color: var(--hue); }
  .ledger .facts .line { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .ledger .rows { padding: 6px 0; }
  .row { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 2px 14px; white-space: nowrap; overflow: hidden; }
  .row .main { overflow: hidden; text-overflow: ellipsis; }
  .row .age { color: var(--muted); font-size: 12px; }
  .row.header .main { font-weight: 700; padding-top: 6px; }
  .row .glyph { display: inline-block; width: 1.5em; }
  /* A row with a page in the site: the name is the link, in its own
     colour, marked only by the underline. */
  .row a { color: inherit; text-decoration: none; border-bottom: 1px dotted var(--muted); }
  .row a:hover, .row a:focus-visible { border-bottom-color: var(--ink); outline: none; }
  .row .sha, .row .author { color: var(--muted); }
  .row.review .glyph { color: var(--hue); }
  .row.notice .main { color: var(--muted); }

  @media (min-width: 960px) {
    body {
      grid-template-columns: 1fr 38ch;
      grid-template-areas: "bar ledger" "strip ledger" "agent ledger" "say ledger";
    }
    .bar .more { display: none; }
    .ledger { display: block; grid-area: ledger; }
    .ledger .close { display: none; }
  }
</style>
</head>
<body>
  <header class="bar">
    <button class="who" id="who" aria-haspopup="listbox" aria-expanded="false" aria-controls="picker">
      <span class="name" id="whoname"></span><span class="caret">▾</span><span class="away"></span><span class="tag" id="autotag">auto</span>
    </button>
    <button class="more" id="more" aria-label="Open the ledger">···</button>
    <div class="state">
      <span class="doing" id="doing"></span>
      <span class="modes">
        <button id="mode-transcript" data-mode="transcript">transcript</button>
        <button id="mode-terminal" data-mode="terminal">terminal</button>
      </span>
    </div>
    <div class="picker" id="picker" role="listbox" aria-label="Choose an agent" hidden></div>
  </header>
  <div class="strip" id="strip" hidden></div>
  <div class="agent">
    <div class="views" id="views"><div class="empty" id="empty">No agents in this session yet.</div></div>
  </div>
  <form class="say" id="say">
    <input id="text" autocomplete="off" placeholder="Say something" aria-label="Say something to the shown agent">
    <button class="attach" id="attach" type="button" aria-label="Attach a file">+</button>
    <input class="file" id="file" type="file" accept="image/png,image/jpeg,image/gif,image/webp,application/pdf,text/plain,text/markdown,text/csv,application/json" hidden>
    <button class="stop" id="stop" type="button" hidden aria-label="Stop the shown agent">Stop</button>
    <button class="send" id="send" type="submit" disabled>Send</button>
    <span class="sent" id="sent"></span>
  </form>
  <div class="viewer" id="viewer" role="dialog" aria-label="Full-size image"></div>
  <aside class="ledger" id="ledger">
    <div class="lhead"><span class="session" id="session"></span><button class="close" id="close">close</button></div>
    <div class="facts" id="facts"></div>
    <div class="rows" id="rows"></div>
  </aside>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const viewsEl = $('views'), emptyEl = $('empty');
  const whoEl = $('who'), whoName = $('whoname'), autoTag = $('autotag'), doingEl = $('doing');
  const pickerEl = $('picker'), stripEl = $('strip');
  const modeBtns = { transcript: $('mode-transcript'), terminal: $('mode-terminal') };
  const form = $('say'), input = $('text'), send = $('send'), sentEl = $('sent'), stopBtn = $('stop');
  const attachBtn = $('attach'), fileInput = $('file');
  const ledgerEl = $('ledger');

  // The TUI's coarse ladder: seconds under a minute read `now`.
  const coarse = (secs) => { const s = Math.max(0, secs); if (s < 60) return 'now'; if (s < 3600) return Math.floor(s / 60) + 'm'; if (s < 86400) return Math.floor(s / 3600) + 'h'; return Math.floor(s / 86400) + 'd'; };
  const now = () => Math.floor(Date.now() / 1000);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  // ---- state ----
  let facts = null;                         // the status frame's facts
  const panes = new Map();                  // pane id → { meta, closed }
  const paneOf = new Map();                 // label → pane id
  const agents = new Map();                 // label → { session, generation, turns[] }  (mirrors PageModel)
  const views = new Map();                  // label → { transcript: el, terminal: el, term }
  let shown = null;                         // the agent on screen
  let live = null;                          // null: never opened; then true/false
  // A browser can refuse storage outright — a private window, blocked
  // site data — and then even READING throws. Remembering which view
  // someone prefers is not worth the whole page.
  const remembered = (key, fallback) => {
    try { return JSON.parse(localStorage.getItem(key) || 'null') ?? fallback; } catch (err) { return fallback; }
  };
  const remember = (key, value) => { try { localStorage.setItem(key, JSON.stringify(value)); } catch (err) {} };
  const modes = remembered('clank.modes', {});
  // Auto follows the turn; a pin names one agent. Kept, so a
  // deliberate pin survives a reload and a phone waking up.
  let selection = (() => {
    const s = remembered('clank.selection', null);
    return s && typeof s.label === 'string' ? { label: s.label } : { auto: true };
  })();
  const keepSelection = () => remember('clank.selection', selection);

  // ---- the reducer the server tests (feed.rs PageModel) ----
  // What a turn IS, for telling activity apart. Ids alone would miss
  // a tool's output arriving, and timestamps alone cannot tell two
  // turns in the same second apart — or any turn whose harness sent
  // no timestamp at all (codex on e14c244).
  const mark = (t) => `${t.id}/${t.body.kind}/${(t.body.text || '').length}/${t.body.output == null ? '-' : t.body.output.length}`;
  const sig = (list) => list.map(mark).join(',');
  // A count of the times an agent's transcript actually CHANGED. An
  // identical replay does not move it, so a deliberate Stop survives
  // being resynced; anything genuinely new does, whatever its clock
  // says.
  const revisionOf = (label) => agents.get(label)?.rev ?? 0;

  function applyTurns(d) {
    const was = agents.get(d.agent);
    const changed = !was
      || was.session !== d.session
      || was.generation !== d.generation
      || sig(was.turns) !== sig(d.turns);
    agents.set(d.agent, {
      session: d.session,
      generation: d.generation,
      turns: d.turns.slice(),
      rev: (was?.rev ?? 0) + (changed ? 1 : 0),
    });
    if (d.agent === shown) { paintTranscript(d.agent); syncSend(); }
  }
  function applyTurn(d) {
    const w = agents.get(d.agent);
    if (!w || w.session !== d.session || w.generation !== d.generation) return;
    const i = w.turns.findIndex((t) => t.id === d.turn.id);
    if (i < 0 || mark(w.turns[i]) !== mark(d.turn)) w.rev = (w.rev ?? 0) + 1;
    if (i >= 0) w.turns[i] = d.turn; else w.turns.push(d.turn);
    if (w.turns.length > 200) w.turns.splice(0, w.turns.length - 200);
    // After the turn is in, not before: `workingOf` reads the newest
    // one, so asking first would answer about the previous turn.
    if (d.agent === shown) { paintTranscript(d.agent); syncSend(); }
  }

  // ---- who is shown ----
  const roster = () => (facts ? facts.agents : []);
  const masterLabel = () => (roster().find((a) => a.role === 'master') || roster()[0] || {}).label || null;
  // Whoever has been kept waiting longest: the oldest obligation, an
  // undated one last. Equal clocks keep the roster's order — sort is
  // stable — so auto cannot flip between two agents routed in the
  // same instant.
  function upNow() {
    const owing = roster().filter((a) => a.owes);
    if (!owing.length) return null;
    const key = (a) => (a.owes.since == null ? Infinity : a.owes.since);
    return owing.slice().sort((x, y) => key(x) - key(y))[0].label;
  }
  function target() {
    if (!selection.auto) {
      if (roster().some((a) => a.label === selection.label)) return selection.label;
      selection = { auto: true };           // the pinned agent left the roster
      keepSelection();
    }
    return upNow() || masterLabel();
  }
  // The one place the view moves by itself. What is in the say box was
  // typed to whoever is shown, and /say delivers it to whoever is
  // shown: any move under a draft hands the message to the wrong
  // agent. So a draft owns the view until it is sent or cleared —
  // including when the agent it was typed to leaves the roster, where
  // the honest answer is a disabled send button, not a new recipient.
  function retarget() {
    // A draft is the box's text OR an upload on its way into it: the
    // path lands in whatever box exists when the response comes back,
    // so an automatic move mid-upload would attach a photo to the
    // wrong agent (codex on a757522).
    if (input.value !== '' || pending > 0 || sending > 0) return;
    const want = target();
    if (want !== shown) show(want);
  }
  input.addEventListener('input', retarget);

  // ---- the header ----
  // Two regions, always: the sentence gives way, the clock does not.
  // One shrinking span would take the clock over the edge with it.
  const said = (html) => `<span class="said">${html}</span>`;
  function clause(a) {
    if (!a) return '';
    if (!a.owes) return said(esc(a.last || 'idle'));
    const o = a.owes;
    return said(`<span class="dot"></span>${esc(o.verb)} <span class="obj">${esc(o.object)}</span>`)
      + (o.since != null ? `<span class="clock">${coarse(now() - o.since)}</span>` : '');
  }
  function paintHeader() {
    whoName.textContent = shown || (roster().length ? '' : 'no agents');
    autoTag.hidden = !selection.auto;
    whoEl.classList.toggle('elsewhere', !selection.auto && roster().some((a) => a.owes && a.label !== shown));
    const a = roster().find((x) => x.label === shown);
    doingEl.innerHTML = live !== true
      ? said(live === null ? 'connecting…' : 'reconnecting…')
      // A draft can hold the view on an agent that has left; say so,
      // because the send button going quiet is not an explanation.
      : (shown && !a ? said(`${esc(shown)} has left the roster`) : clause(a));
  }

  // ---- the picker ----
  function optHtml(key, name, role, doing, on) {
    return `<button class="opt" role="option" data-key="${esc(key)}" aria-selected="${on}">`
      + `<span class="nm">${esc(name)}</span>${role ? `<span class="role">${esc(role)}</span>` : ''}`
      + `<span class="doing">${doing}</span></button>`;
  }
  function paintPicker() {
    const had = document.activeElement && document.activeElement.closest('.opt');
    const up = upNow() || masterLabel();
    const rows = [optHtml('auto', 'auto', '', said(`follows the turn — ${esc(up || 'nobody')} now`), !!selection.auto)];
    for (const a of roster()) rows.push(optHtml(`pin:${a.label}`, a.label, a.role, clause(a), selection.label === a.label));
    pickerEl.innerHTML = rows.join('');
    if (had) pickerEl.querySelector(`.opt[data-key="${CSS.escape(had.dataset.key)}"]`)?.focus();
  }
  function openPicker(open) {
    pickerEl.hidden = !open;
    whoEl.setAttribute('aria-expanded', open ? 'true' : 'false');
    if (open) { paintPicker(); pickerEl.querySelector('.opt[aria-selected="true"]')?.focus(); }
  }
  whoEl.addEventListener('click', () => openPicker(pickerEl.hidden));
  pickerEl.addEventListener('click', (e) => {
    const opt = e.target.closest('.opt'); if (!opt) return;
    const k = opt.dataset.key;
    selection = k === 'auto' ? { auto: true } : { label: k.slice(4) };
    keepSelection();
    openPicker(false);
    show(target());                        // an explicit pick moves, draft or not
    whoEl.focus();
  });
  document.addEventListener('click', (e) => {
    if (!pickerEl.hidden && !pickerEl.contains(e.target) && !whoEl.contains(e.target)) openPicker(false);
  });
  document.addEventListener('keydown', (e) => {
    if (pickerEl.hidden) return;
    if (e.key === 'Escape') { openPicker(false); whoEl.focus(); return; }
    if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
    const opts = [...pickerEl.querySelectorAll('.opt')];
    const at = opts.indexOf(document.activeElement);
    const next = at < 0 ? opts[0] : opts[(at + (e.key === 'ArrowDown' ? 1 : opts.length - 1)) % opts.length];
    if (next) { next.focus(); e.preventDefault(); }
  });

  // ---- an interruption, while it lasts ----
  function paintStrip() {
    const asks = facts ? facts.ledger.blocks : [];
    const fix = facts && facts.correction;
    if (!asks.length && !fix) { stripEl.hidden = true; stripEl.innerHTML = ''; return; }
    stripEl.hidden = false;
    stripEl.innerHTML = [
      ...asks.map((b) => `${esc(b)}<span class="how">Answer it at the terminal, or with clank block answer.</span>`),
      fix ? `${esc(fix)}<span class="how">${esc(masterLabel() || 'master')}'s to repair.</span>` : '',
    ].filter(Boolean).join('');
  }

  // ---- the agent ----
  function ensureViews(label) {
    if (views.has(label)) return;
    const transcript = document.createElement('div'); transcript.className = 'view transcript'; transcript.innerHTML = '<div class="turns"></div>';
    const terminal = document.createElement('div'); terminal.className = 'view terminal'; terminal.innerHTML = '<div class="term"></div><div class="gone"></div>';
    viewsEl.append(transcript, terminal);
    const term = new Terminal({ cols: 80, rows: 24, disableStdin: true, cursorBlink: false, scrollback: 0, fontFamily: 'ui-monospace, Menlo, "SF Mono", Consolas, monospace', fontSize: 13, allowProposedApi: true, theme: { background: '#1a1917', foreground: '#e8e4dc' } });
    term.open(terminal.querySelector('.term'));
    views.set(label, { transcript, terminal, term });
  }

  function hasTranscript(label) { return !!roster().find((a) => a.label === label)?.transcript; }
  function modeFor(label) {
    const wanted = modes[label] || (hasTranscript(label) ? 'transcript' : 'terminal');
    return wanted === 'transcript' && !hasTranscript(label) ? 'terminal' : wanted;
  }

  // Whoever is on screen is who /say reaches, so the button follows
  // the shown agent's pane and nothing else.
  // Whether an agent is mid-turn, decided HERE because only here are
  // both halves live: the server's turn-end stamp arrives with the
  // status, and turns arrive on their own — a long read-only turn
  // changes nothing a status frame is published for.
  //
  // `unknown` whenever the evidence cannot answer, which is the
  // normal case rather than an edge: two of the four harnesses have
  // no transcript adapter and grok's hooks are passive, so no end is
  // ever recorded for them.
  //
  // A tie reads as NOT working. The hook fires in the same second as
  // a turn's last message most of the time and these are epoch
  // seconds, so `>=` would leave an idle agent busy forever after
  // nearly every turn; `>` is wrong only until the next turn lands.
  const newestOf = (label) => {
    const mine = agents.get(label);
    return mine ? mine.turns.reduce((m, t) => (t.at != null && t.at > m ? t.at : m), -1) : -1;
  };
  function workingOf(label) {
    const a = roster().find((x) => x.label === label);
    if (!a || !a.transcript || a.ended == null) return 'unknown';
    return newestOf(label) > a.ended ? 'yes' : 'no';
  }

  // Stop was pressed, and nothing has happened since. Suppression is
  // scoped to the ACTIVITY it stopped — the pane, the incarnation,
  // and how far the transcript had got — and then DERIVED rather than
  // maintained, so both ways a transcript arrives are covered by one
  // rule. Clearing it on the incremental path alone left a reconnect
  // (which resends the whole window) unable to re-arm the button, and
  // a new session in the SAME pane looked like the old one (codex on
  // 210afee).
  const stopped = new Map();
  function stopping(label) {
    const s = stopped.get(label);
    if (!s) return false;
    if (paneOf.get(label) !== s.pane) return false;         // a new pane is new work
    const w = agents.get(label);
    if (!w) return true;                                    // no transcript: nothing can say otherwise
    if (w.session !== s.session || w.generation !== s.generation) return false;
    return revisionOf(label) === s.rev;                     // any new activity re-arms
  }
  function syncSend() {
    const p = panes.get(shown && paneOf.get(shown));
    // Not while a file is still arriving — a message is not ready
    // until everything it names is in it — and not while one is
    // already on its way, or finishing an upload would re-open the
    // button and let the same instruction go twice (codex on
    // 37014d0).
    send.disabled = !p || p.closed || pending > 0 || sending > 0;
    stopBtn.hidden = !p || p.closed || workingOf(shown) === 'no' || stopping(shown);
  }
  function show(label) {
    shown = label;
    const mode = label ? modeFor(label) : null;
    for (const [m, btn] of Object.entries(modeBtns)) {
      btn.classList.toggle('on', m === mode);
      btn.disabled = !label || (m === 'transcript' && !hasTranscript(label));
    }
    for (const [l, v] of views) {
      v.transcript.classList.toggle('on', l === label && mode === 'transcript');
      v.terminal.classList.toggle('on', l === label && mode === 'terminal');
    }
    syncSend();
    input.placeholder = label ? `Say something to ${label}` : 'Say something';
    const p = panes.get(label && paneOf.get(label));
    if (label) { paintTranscript(label); if (p && !p.closed) views.get(label).term.scrollToBottom(); }
    paintHeader();
  }
  for (const [m, btn] of Object.entries(modeBtns)) btn.addEventListener('click', () => { if (!shown) return; modes[shown] = m; remember('clank.modes', modes); show(shown); });

  // Turns are rendered ONCE and updated in place, keyed by id: a
  // repaint that rebuilt them would close every <details> the reader
  // had opened (codex on 056a342). Harness turns are not rendered at
  // all — the adapters mark them so this can be the clean transcript.
  function turnHtml(t) {
    const b = t.body;
    const age = `<span class="age"></span>`;
    if (b.kind === 'text') return `${age}<div class="text prose"></div>`;
    if (b.kind === 'thinking') return `${age}<details><summary>thinking</summary><pre class="text"></pre></details>`;
    if (b.kind === 'image') return `${age}<span class="shots"></span>`;
    return `${age}<details class="tool"><summary><span class="name"></span> <span class="in"></span><span class="pending"></span></summary><pre class="in"></pre><pre class="out"></pre><div class="shots"></div></details>`;
  }
  // An image the transcript carried: the picture on a data URL, the
  // full thing in a new tab; one over the cap named by its size.
  function shotHtml(img) {
    if (img.data == null) return `<span class="unshipped">image, ${mb(img.bytes)} — not shown</span>`;
    const src = `data:${img.media_type};base64,${img.data}`;
    return `<img class="shot" loading="lazy" src="${esc(src)}" alt="pasted image">`;
  }
  const viewerEl = $('viewer');
  function showFull(src) {
    viewerEl.innerHTML = `<img src="${esc(src)}" alt="pasted image, full size">`;
    viewerEl.classList.add('open');
  }
  function hideFull() { viewerEl.classList.remove('open'); viewerEl.innerHTML = ''; }
  viewsEl.addEventListener('click', (e) => { const img = e.target.closest('img.shot'); if (img) showFull(img.getAttribute('src')); });
  viewerEl.addEventListener('click', hideFull);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && viewerEl.classList.contains('open')) hideFull(); });
  function mb(bytes) { return (bytes / 1048576).toFixed(1) + ' MB'; }
  function fillShots(box, images, key) {
    // Repainted only when the set changes: a rebuilt <img> reloads.
    const k = images.map((i) => (i.data ? i.data.length : 'x') + ':' + i.bytes).join(',');
    if (box.dataset.k === k) return;
    box.dataset.k = k;
    box.innerHTML = images.map(shotHtml).join('');
  }
  function fillTurn(el, t) {
    const b = t.body;
    el.querySelector('.age').textContent = t.at ? coarse(now() - t.at) : '';
    if (b.kind === 'text') {
      // The ONLY innerHTML in this file that carries agent words.
      // `render_markdown` made this markup: raw HTML escaped, every
      // destination checked against an allow-list. A turn from before
      // that existed has no `html`, and falls back to its own text.
      const box = el.querySelector('.text');
      if (b.html) box.innerHTML = b.html; else box.textContent = b.text;
      return;
    }
    if (b.kind === 'thinking') { el.querySelector('.text').textContent = b.text; return; }
    if (b.kind === 'image') { fillShots(el.querySelector('.shots'), [b]); return; }
    el.querySelector('summary .name').textContent = b.name;
    el.querySelector('summary .in').textContent = b.input.slice(0, 120);
    el.querySelector('summary .pending').textContent = b.output == null ? ' …' : '';
    el.querySelector('pre.in').textContent = b.input;
    const out = el.querySelector('pre.out');
    out.textContent = b.output == null ? '' : b.output;
    out.hidden = b.output == null;
    fillShots(el.querySelector('.shots'), b.images || []);
  }
  // A run of tool calls with no prose between them is one row: what
  // was said stays readable, what was DONE is one tap away.
  function slotsOf(turns) {
    const slots = [];
    for (const t of turns) {
      const last = slots[slots.length - 1];
      if (t.body.kind === 'tool' && last && last.tools) last.turns.push(t);
      else slots.push({ tools: t.body.kind === 'tool', turns: [t] });
    }
    return slots;
  }

  // Put `t`'s element in `parent` at `cursor`, making it if it is
  // new. Looked up from `box` rather than `parent` because a turn
  // moves between the top level and a group as its run grows, and
  // rebuilding it would close whatever the reader had opened.
  function placeTurn(box, parent, t, cursor) {
    let el = box.querySelector(`[data-id="${CSS.escape(t.id)}"]`);
    if (!el) {
      el = document.createElement('div');
      el.dataset.id = t.id;
      el.className = `turn ${t.who} ${t.body.kind}`;
      el.innerHTML = turnHtml(t);
      parent.insertBefore(el, cursor);
    } else if (el !== cursor) {
      parent.insertBefore(el, cursor);
    }
    fillTurn(el, t);
    return el.nextElementSibling;
  }

  function paintTranscript(label) {
    const v = views.get(label); if (!v) return;
    const box = v.transcript.querySelector('.turns');
    const w = agents.get(label);
    const shown = (w ? w.turns : []).filter((t) => t.who !== 'harness');
    if (!shown.length) { box.innerHTML = `<div class="turn empty-note"><span class="text">Nothing said yet.</span></div>`; return; }
    if (box.querySelector('.empty-note')) box.innerHTML = '';
    const atBottom = v.transcript.scrollTop + v.transcript.clientHeight >= v.transcript.scrollHeight - 40;
    const keep = new Set();
    let cursor = box.firstElementChild;
    for (const slot of slotsOf(shown)) {
      if (!slot.tools || slot.turns.length === 1) {
        for (const t of slot.turns) { keep.add(t.id); cursor = placeTurn(box, box, t, cursor); }
        continue;
      }
      const key = `g:${slot.turns[0].id}`;
      keep.add(key);
      let g = box.querySelector(`[data-id="${CSS.escape(key)}"]`);
      if (!g) {
        // A wrapper is born closed, and that is wrong twice over.
        //
        // A lone call becoming a run must not take back what the
        // reader is looking at: their opened output would vanish
        // under a closed wrapper (codex on f100b52).
        //
        // And the key is the first member's id, so retention evicting
        // that turn REKEYS the run: a wrapper is replaced mid-read,
        // and asking "is anything inside open" would reopen a run the
        // reader had deliberately closed around an open child (codex
        // on 5d3bf82). A replacement inherits what it replaces; only
        // a genuine lone-call transition consults the call itself.
        const had = slot.turns
          .map((t) => box.querySelector(`[data-id="${CSS.escape(t.id)}"]`))
          .find((el) => el && el.closest('.did'));
        const showing = had
          ? had.closest('.did').open
          : slot.turns.some((t) => {
              const was = box.querySelector(`[data-id="${CSS.escape(t.id)}"]`);
              return !!was?.querySelector('details')?.open;
            });
        g = document.createElement('details');
        g.className = 'did'; g.dataset.id = key;
        g.innerHTML = '<summary></summary><div class="members"></div>';
        g.open = showing;
        box.insertBefore(g, cursor);
      } else if (g !== cursor) {
        box.insertBefore(g, cursor);
      }
      const running = slot.turns.some((t) => t.body.output == null);
      g.querySelector('summary').textContent = `${running ? 'Running' : 'Ran'} ${slot.turns.length} commands${running ? '…' : ''}`;
      const members = g.querySelector('.members');
      const mine = new Set();
      let mc = members.firstElementChild;
      for (const t of slot.turns) { mine.add(t.id); mc = placeTurn(box, members, t, mc); }
      for (const el of [...members.children]) if (!mine.has(el.dataset.id)) el.remove();
      cursor = g.nextElementSibling;
    }
    for (const el of [...box.children]) if (!keep.has(el.dataset.id)) el.remove();
    if (atBottom) v.transcript.scrollTop = v.transcript.scrollHeight;
  }

  // ---- panes (terminal mode) ----
  function onPanes(d) {
    const seen = new Set();
    for (const meta of d.panes) {
      seen.add(meta.id);
      const prev = panes.get(meta.id);
      panes.set(meta.id, { meta, closed: d.closed.includes(meta.id) || meta.exited });
      paneOf.set(meta.label, meta.id);
      ensureViews(meta.label);
      const v = views.get(meta.label);
      if (!prev || prev.meta.columns !== meta.columns || prev.meta.rows !== meta.rows) v.term.resize(meta.columns || 80, meta.rows || 24);
      v.terminal.classList.toggle('closed', panes.get(meta.id).closed);
      v.terminal.querySelector('.gone').textContent = `${meta.label}'s pane closed`;
    }
    for (const id of [...panes.keys()]) if (!seen.has(id)) panes.delete(id);
    if (shown) show(shown);
  }
  function onPane(d) {
    const p = panes.get(d.pane_id); if (!p) return;
    views.get(p.meta.label)?.term.write(d.screen);
  }

  // ---- the ledger ----
  function paintLedger() {
    if (!facts) return;
    const L = facts.ledger;
    $('facts').innerHTML = [
      L.plan ? `<div class="plan">${esc(L.plan)}</div>` : `<div class="line">no active plan</div>`,
      L.gate ? `<div>gate <span class="gate">${esc(L.gate)}</span></div>` : '',
      L.dirty ? `<div class="line">dirty ${esc(L.dirty)}</div>` : '',
      (L.queue || L.stash) ? `<div class="line">${L.queue ? `${L.queue} queued` : ''}${L.queue && L.stash ? ', ' : ''}${L.stash ? `${L.stash} stashed` : ''}</div>` : '',
    ].join('');
    // A row's page is the clank html one, in a window of its own. The
    // builder writes a plan's name verbatim, spaces and all; the link
    // encodes each segment and the server decodes it.
    const href = (page) => 'html/' + page.split('/').map(encodeURIComponent).join('/');
    const link = (r, inner) => r.page ? `<a href="${esc(href(r.page))}" target="_blank" rel="noopener">${inner}</a>` : inner;
    $('rows').innerHTML = L.rows.map((r) => {
      const main = r.kind === 'header' ? link(r, esc(r.text))
        : r.kind === 'commit' ? `<span class="glyph">${esc(r.glyph || '')}</span>${link(r, `<span class="sha">${esc(r.sha || '')}</span>`)} ${esc(r.text)}`
        : r.kind === 'review' ? `<span class="glyph">${esc(r.glyph || '')}</span>${link(r, `<span class="author">${esc(r.author || '')}</span>`)}${r.text ? ': ' + esc(r.text) : ''}`
        : esc(r.text);
      return `<div class="row ${r.kind}"><span class="main">${main}</span><span class="age">${esc(r.age || '')}</span></div>`;
    }).join('');
  }
  $('more').addEventListener('click', () => ledgerEl.classList.add('open'));
  $('close').addEventListener('click', () => ledgerEl.classList.remove('open'));

  // ---- status ----
  function onStatus(d) {
    facts = d.facts;
    document.documentElement.style.setProperty('--hue', facts.hue || '#5f5fff');
    for (const a of roster()) ensureViews(a.label);
    emptyEl.style.display = roster().length ? 'none' : 'flex';
    if (shown) retarget(); else show(target());
    show(shown);                            // the frame may have opened or closed a pane
    paintPicker(); paintStrip(); paintLedger();
  }
  setInterval(() => { paintHeader(); if (!pickerEl.hidden) paintPicker(); if (shown) paintTranscript(shown); }, 60000);

  // ---- the live channel ----
  // A WebSocket, not an EventSource: the accountless tunnel's edge
  // buffers a response body until it completes and so never delivers
  // a stream, while an upgrade's frames come through at once. The
  // frames themselves are unchanged — `event: NAME\ndata: JSON` —
  // so the server side of the feed did not have to move.
  const handlers = { status: onStatus, panes: onPanes, pane: onPane, turns: applyTurns, turn: applyTurn };
  let socket = null, retry = 0, closedForGood = false;

  function deliver(text) {
    const cut = text.indexOf('\n');
    if (cut < 0) return;
    const event = text.slice(0, cut).replace(/^event: /, '');
    const data = text.slice(cut + 1).replace(/^data: /, '').replace(/\n+$/, '');
    const handler = handlers[event];
    if (!handler || !data) return;
    try { handler(JSON.parse(data)); } catch (err) { console.error(event, err); }
  }

  function connect() {
    if (closedForGood) return;
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    socket = new WebSocket(`${proto}//${location.host}/events`);
    socket.onopen = () => { retry = 0; live = true; paintHeader(); };
    socket.onmessage = (e) => deliver(e.data);
    // Unlike an EventSource, a socket does not retry itself. A close
    // the door caused — the session revoked or expired — must not be
    // retried forever, so the page asks which before backing off.
    socket.onclose = async () => {
      live = false; paintHeader();
      try {
        if ((await fetch('/whoami')).status === 401) {
          closedForGood = true;
          location.replace('/login');
          return;
        }
      } catch (err) {}
      retry = Math.min(retry + 1, 6);
      setTimeout(connect, Math.min(250 * 2 ** retry, 10000));
    };
    socket.onerror = () => { try { socket.close(); } catch (err) {} };
  }

  // An attachment is a FILE and the message names it: a pane is a
  // keyboard, and bytes cannot be typed. The path lands in the box as
  // TEXT, where it can be read and edited before it is sent — an
  // invisible attachment would hide the one thing that has to be true
  // for this to work, which is that the agent is being asked to go
  // and read something.
  let pending = 0;      // uploads on their way into the box
  let sending = 0;      // messages dispatched and not yet answered
  attachBtn.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', async () => {
    const file = fileInput.files && fileInput.files[0];
    fileInput.value = '';
    if (!file) return;
    sentEl.textContent = 'Attaching…';
    pending += 1;
    syncSend();                       // Send waits for it
    try {
      const r = await fetch('/upload', { method: 'POST', headers: { 'content-type': file.type || 'application/octet-stream' }, body: file });
      if (!r.ok) throw new Error(await r.text());
      const { path } = await r.json();
      input.value = input.value ? `${input.value} ${path}` : path;
      sentEl.textContent = '';
      input.focus();
    } catch (err) {
      sentEl.textContent = 'Not attached';
      setTimeout(() => { sentEl.textContent = ''; }, 2000);
      console.error(err);
    } finally {
      pending -= 1;
      syncSend();                     // Send was waiting for this
      retarget();                     // and so was the view
    }
  });

  stopBtn.addEventListener('click', async () => {
    // Captured now: by the time this returns, `shown` may be someone
    // else, and a stop must never settle the wrong agent's button.
    const label = shown, pid = label && paneOf.get(label);
    if (!pid) return;
    const w = agents.get(label);
    stopped.set(label, {
      pane: pid,
      session: w && w.session,
      generation: w && w.generation,
      rev: revisionOf(label),
    });
    syncSend();
    try {
      const r = await fetch('/stop', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ pane: pid }) });
      if (!r.ok) throw new Error(await r.text());
    } catch (err) {
      // It was not stopped, so the button must come back — the agent
      // is still running and this is the only way to try again.
      if (stopped.get(label)?.pane === pid) stopped.delete(label);
      syncSend();
      sentEl.textContent = 'Not stopped';
      setTimeout(() => { sentEl.textContent = ''; }, 1500);
      console.error(err);
    }
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const shownWas = shown, pid = shown && paneOf.get(shown), text = input.value;
    if (!pid || !text) return;
    // A keyboard can submit a form whose button is disabled.
    if (pending > 0 || sending > 0) {
      sentEl.textContent = pending > 0 ? 'Still attaching' : 'Still sending';
      setTimeout(() => { sentEl.textContent = ''; }, 1500);
      return;
    }
    // The submitted text LEAVES the draft here, at dispatch. It now
    // belongs to the request; the box is the next message. Nothing
    // downstream has to work out which characters were sent — the
    // answer used to be a prefix comparison, and replacing "hi" with
    // "history matters" made it "story matters" (codex on 37014d0).
    input.value = '';
    sending += 1;
    syncSend();

    send.disabled = true;
    try {
      const r = await fetch('/say', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ pane: pid, text }) });
      if (!r.ok) throw new Error(await r.text());
      // Setting .value fires no input event, so the draft's release
      // has to say so itself.
      sentEl.textContent = 'Sent'; setTimeout(() => { sentEl.textContent = ''; }, 1500);
      stopped.delete(shownWas);       // new work: whatever was stopped is not any more
      retarget();
    } catch (err) {
      // It never went, so give it back — in front of anything typed
      // since, which is the order they were written in.
      input.value = input.value ? `${text} ${input.value}` : text;
      sentEl.textContent = 'Not sent';
      console.error(err);
    } finally {
      sending -= 1;
      syncSend();
      retarget();
      input.focus();
    }
  });

  $('session').textContent = document.title = window.CLANK_SESSION || 'clank';
  connect();
})();
</script>
</body>
</html>
