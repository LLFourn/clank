<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>clank</title>
<link rel="stylesheet" href="/xterm.css">
<script src="/xterm.js"></script>
<style>
  /* The face, declared here and served from this binary: the
     stylesheet that used to declare it was fetched from Google, on a
     page that keeps a credential. */
  @font-face {
    font-family: "Martian Mono";
    font-style: normal;
    font-weight: 700;
    font-display: swap;
    src: url("/plate.woff2") format("woff2");
  }
  :root {
    --base: #faf9f7;
    --bezel: #f1efe9;
    --edge: #e3ded4;
    --ink: #262420;
    --muted: #6a655c;
    --hue: #5f5fff;
    /* The verdict colours. Independent of `--hue`, which the script
       reassigns per session state -- a mark that tracked it could not
       be right about its own verdict. */
    --ok: #2f8f4e;
    --done: #2a7f9e;
    --changes: #c2401f;
    /* The state hues were picked to glow on a dark ground. Anything
       that must carry TEXT — a filled button — takes them mixed
       toward the ink instead, or a yellow `reviewing` lamp puts pale
       letters on pale yellow. */
    --hue-deep: color-mix(in srgb, var(--hue) 58%, #17150f);
    --mono: ui-monospace, Menlo, "SF Mono", Consolas, monospace;
    --text: ui-sans-serif, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --plate: "Martian Mono", var(--mono);
    /* The terminal keeps its own ground at every width: agents choose
       ANSI colours assuming a dark one, and bright-white-on-white is
       not something CSS out here can fix. */
    /* One measure for the reading column and the composer, so the
       two line up. 68ch of proportional text came out at 605px and
       still read narrow beside the reference. */
    --column: 46rem;
    --pane: #1a1917;
    --pane-ink: #e8e4dc;
  }
  * { box-sizing: border-box; }
  /* Hidden means hidden. A `display` rule written for one control
     otherwise reaches every element it matches — a `.say input`
     declaration put the native file picker on screen beside `+`
     (codex on d772e3e) — and two controls here rely on `hidden`. */
  [hidden] { display: none !important; }
  /* A grid item's `min-width: auto` is its CONTENT's minimum, so one
     unshrinkable row — the composer, with its buttons — widens the
     whole column and pushes Send off a 320px screen (codex on
     a757522). Every area here scrolls or truncates internally. */
  body > * { min-width: 0; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--base); color: var(--ink);
    font: 14px/1.5 var(--text);
    display: grid;
    grid-template-rows: auto auto 1fr auto;
    grid-template-columns: 1fr;
    grid-template-areas: "bar" "strip" "agent" "say";
    overflow: hidden;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; text-align: left; }
  button:focus-visible { outline: 2px solid var(--hue); outline-offset: -2px; }

  /* The header: the shown agent, said once, and what it owes. */
  .bar {
    grid-area: bar; position: relative;
    display: grid; grid-template-columns: minmax(0, 1fr) auto;
    padding: 6px 14px 8px;
  }
  /* The repo, then the agent, on one line: a page about a repo says
     which repo, and two remotes open at once are otherwise identical.
     The project gives way first when the screen is narrow — it is the
     context, the agent is the subject. */
  .bar .ident { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
  .bar .project { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); font-size: 13px; }
  .bar .project::after { content: "/"; margin-left: 8px; opacity: .5; }
  .bar .who { display: inline-flex; align-items: baseline; gap: 7px; padding: 6px 2px 6px 0; margin: -6px 0; min-width: 0; }
  .bar .who .name { font-family: var(--plate); font-weight: 700; font-size: 22px; letter-spacing: -0.02em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar .who .caret { color: var(--muted); font-size: 13px; }
  /* Pinned, with the turn somewhere else: the one thing the header
     cannot say when it is showing a name of your choosing. */
  .bar .who .away { display: none; width: 7px; height: 7px; border-radius: 50%; background: var(--hue); animation: breathe 2.4s ease-in-out infinite; }
  .bar .who.elsewhere .away { display: inline-block; }
  .bar .who .tag { color: var(--muted); font-size: 11px; }
  .bar .more { grid-column: 2; min-width: 44px; min-height: 44px; margin: -8px -12px 0 0; font-size: 20px; letter-spacing: 2px; color: var(--ink); display: inline-flex; align-items: center; justify-content: center; }
  .state { grid-column: 1 / -1; display: flex; align-items: baseline; gap: 14px; margin-top: 1px; }
  .state .doing { flex: 1 1 auto; min-width: 0; color: var(--muted); font-size: 12px; }
  .doing { display: flex; align-items: baseline; gap: 9px; }
  .doing .said { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .doing .obj { color: var(--ink); }
  .doing .clock { flex: 0 0 auto; font-family: var(--plate); font-weight: 700; color: var(--ink); }
  .state .doing .dot, .picker .doing .dot {
    display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: var(--hue); margin-right: 7px; vertical-align: 1px;
    animation: breathe 2.4s ease-in-out infinite;
  }
  .state .modes { flex: 0 0 auto; display: flex; gap: 11px; font-size: 12px; }
  .state .modes button { color: var(--muted); padding: 2px 0; border-bottom: 2px solid transparent; }
  .state .modes button.on { color: var(--ink); border-bottom-color: var(--ink); }
  .state .modes button:disabled, .state .modes button[aria-disabled="true"] { opacity: 0.4; }
  .state .modes button[aria-disabled="true"] { cursor: help; }
  .chat-reason { position: absolute; top: 100%; right: 8px; z-index: 5; width: min(330px, calc(100vw - 16px)); padding: 12px; background: var(--bezel); border: 1px solid var(--edge); border-radius: 8px; box-shadow: 0 18px 44px rgba(0, 0, 0, .5); font-size: 13px; }
  .chat-reason button { display: block; margin: 9px 0 0 auto; color: var(--hue-deep); text-decoration: underline; }
  @keyframes breathe { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
  @media (prefers-reduced-motion: reduce) { .dot, .away { animation: none; } }

  /* The picker: every agent, and `auto` — whoever's turn it is. */
  .picker {
    position: absolute; top: 100%; left: 0; right: 0; z-index: 4;
    background: var(--bezel); border-top: 1px solid var(--edge); border-bottom: 1px solid var(--edge);
    box-shadow: 0 18px 44px rgba(0, 0, 0, .5);
    max-height: 62vh; overflow: auto;
  }
  .picker .opt { display: block; width: 100%; padding: 9px 14px 10px; border-bottom: 1px solid var(--edge); border-left: 3px solid transparent; }
  .picker .opt:last-child { border-bottom: 0; }
  .picker .opt[aria-selected="true"] { border-left-color: var(--hue); }
  .picker .opt .nm { font-family: var(--plate); font-weight: 700; font-size: 15px; }
  .picker .opt .role { color: var(--muted); font-size: 11px; margin-left: 8px; }
  .picker .opt .doing { color: var(--muted); font-size: 12px; margin-top: 2px; }

  /* An interruption, not chrome: here while it is true, gone after. */
  .strip { grid-area: strip; padding: 9px 14px; background: color-mix(in srgb, var(--hue) 13%, var(--bezel)); border-top: 1px solid var(--edge); border-bottom: 1px solid var(--edge); font-size: 12px; white-space: pre-wrap; }
  .strip .how { display: block; color: var(--muted); margin-top: 3px; }

  /* One agent. */
  .agent { grid-area: agent; display: grid; min-height: 0; border-top: 1px solid var(--edge); }
  .views { position: relative; min-height: 0; }
  .view { position: absolute; inset: 0; overflow: auto; display: none; }
  .view.on { display: block; }
  .empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--muted); padding: 24px; text-align: center; }

  /* Transcript: turns in a column. The agent's are plain; what the
     person said sits in a block of its own, so who is speaking needs
     no label. How long ago is the one thing worth a mark, at the
     right edge of every turn. */
  .turns { padding: 18px 20px 28px; max-width: var(--column); margin-inline: auto; font-size: 16px; line-height: 1.62; }
  .turn { position: relative; padding: 10px 0; }
  .turn .age { float: right; margin: 4px 0 0 12px; color: var(--muted); font-size: 11px; font-family: var(--mono); }
  /* What the person said is a block of its own, so who is speaking
     needs no label. */
  .turn.person { margin: 14px 0; padding: 12px 14px; background: var(--bezel); border: 1px solid var(--edge); border-radius: 10px; }
  .turn.outgoing { border-style: dashed; }
  .turn.outgoing .text { white-space: pre-wrap; }
  .turn.outgoing .delivery { display: block; margin-top: 6px; color: var(--muted); font: 12px var(--mono); overflow-wrap: anywhere; }
  .turn.outgoing.failed .delivery { color: var(--bad, #d05a4a); }
  .turn.outgoing .retry, .turn.outgoing .dismiss { margin: 6px 12px 0 0; color: var(--hue-deep); font: 12px var(--mono); text-decoration: underline; }
  .turn .text { overflow-wrap: anywhere; }
  .turn.harness .text { color: var(--muted); font-size: 13px; }
  .turn.thinking .text { color: var(--muted); }

  /* Rendered prose. `render_markdown` is the only thing allowed to
     produce this markup; it escapes raw HTML and refuses a
     destination whose scheme is not on its list. */
  .prose > :first-child { margin-top: 0; }
  .prose > :last-child { margin-bottom: 0; }
  .prose p, .prose ul, .prose ol, .prose blockquote, .prose table { margin: 0 0 0.85em; }
  .prose h1, .prose h2, .prose h3, .prose h4 { margin: 1.4em 0 0.5em; line-height: 1.25; font-weight: 650; }
  .prose h1 { font-size: 1.4em; }
  .prose h2 { font-size: 1.22em; }
  .prose h3 { font-size: 1.08em; }
  .prose h4 { font-size: 1em; }
  .prose ul, .prose ol { padding-left: 1.4em; }
  .prose li { margin: 0.25em 0; }
  .prose blockquote { margin-left: 0; padding: 0.1em 0 0.1em 1em; border-left: 3px solid var(--edge); color: var(--muted); }
  .prose a { color: var(--hue-deep); text-underline-offset: 2px; }
  .prose code { font-family: var(--mono); font-size: 0.86em; background: var(--bezel); border: 1px solid var(--edge); border-radius: 4px; padding: 0.1em 0.32em; }
  .prose pre { margin: 0 0 0.9em; padding: 10px 12px; background: var(--bezel); border: 1px solid var(--edge); border-radius: 8px; overflow-x: auto; }
  .prose pre code { font-size: 0.85em; background: none; border: 0; padding: 0; }
  .prose table { border-collapse: collapse; display: block; overflow-x: auto; }
  .prose th, .prose td { border: 1px solid var(--edge); padding: 4px 9px; text-align: left; }
  .prose hr { border: 0; border-top: 1px solid var(--edge); margin: 1.2em 0; }
  .prose img { max-width: 100%; border-radius: 6px; }

  /* What was DONE, one tap from what was said: a run of tool calls
     with no prose between them is one row. */
  .did { margin: 4px 0 10px; }
  .did > summary, .turn.tool details > summary { cursor: pointer; list-style: none; color: var(--muted); font-family: var(--mono); font-size: 13px; padding: 3px 0; }
  .did > summary::-webkit-details-marker, .turn.tool summary::-webkit-details-marker { display: none; }
  .did > summary::before { content: "▸ "; }
  .did[open] > summary::before { content: "▾ "; }
  .did .members { padding-left: 14px; border-left: 1px solid var(--edge); margin-left: 3px; }
  .turn details summary { cursor: pointer; list-style: none; color: var(--muted); font-family: var(--mono); font-size: 13px; }
  .turn details summary::before { content: "▸ "; }
  .turn details[open] summary::before { content: "▾ "; }
  .turn .tool .name { color: var(--ink); }
  .turn pre { margin: 6px 0 0; padding: 8px 10px; background: var(--bezel); border: 1px solid var(--edge); border-radius: 6px; white-space: pre-wrap; overflow-wrap: anywhere; font-family: var(--mono); font-size: 12px; max-height: 40vh; overflow: auto; }
  /* A picture, as pasted: no wider than the column, no taller than
     most of the screen; the full thing a tap away. */
  .turn .shot { display: block; max-width: 100%; max-height: 60vh; margin: 6px 0 0; border-radius: 6px; border: 1px solid var(--edge); cursor: zoom-in; }
  .turn .shots { margin-top: 6px; }
  .turn .unshipped { color: var(--muted); font-size: 12px; }
  /* The full picture, in the page: a browser will not open a data
     URL as a page of its own, so the viewer is ours — natural size,
     scrollable, gone on a tap or Escape. */
  .viewer { display: none; position: fixed; inset: 0; z-index: 6; background: rgba(0, 0, 0, .88); overflow: auto; cursor: zoom-out; }
  .viewer.open { display: block; }
  .viewer img { display: block; margin: 24px auto; max-width: none; }
  .turn pre[hidden] { display: none; }

  /* Terminal: the pane at its desktop size, in a scroller. */
  .terminal { -webkit-overflow-scrolling: touch; touch-action: pan-x pan-y pinch-zoom; padding: 6px 0 0 6px; background: var(--pane); color: var(--pane-ink); }
  .terminal .term { width: max-content; }
  .terminal .gone { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; color: var(--pane-ink); background: color-mix(in srgb, var(--pane) 78%, transparent); }
  .terminal.closed .gone { display: flex; }

  /* Say something. */
  /* One bubble: what you are writing across the top, what you can do
     with it on the row beneath. A single row made the writing area
     compete with every button for the same line, which is how Send
     ended up off a 320px screen. */
  .say { grid-area: say; padding: 10px 14px calc(12px + env(safe-area-inset-bottom)); background: var(--base); }
  .bubble { max-width: var(--column); margin-inline: auto; background: var(--bezel); border: 1px solid var(--edge); border-radius: 18px; padding: 10px 8px 8px 14px; }
  /* A paragraph, not a search term: it WRAPS and grows downward, and
     the height is set from the script because a textarea has no
     content-sized height of its own. `resize: none` because the
     script owns the height; `overflow-y: auto` only bites once the
     cap is reached. */
  .say #text { display: block; width: 100%; background: none; color: var(--ink); border: 0; padding: 2px 6px 6px 0; font: 16px var(--text); resize: none; overflow-y: auto; line-height: 1.45; }
  .say #text:focus { outline: none; }
  .bubble:focus-within { border-color: color-mix(in srgb, var(--hue) 45%, var(--edge)); }
  .tools { display: flex; align-items: center; gap: 8px; }
  .tools .sent { margin-left: auto; }
  .say button.send { background: var(--hue-deep); color: #fff; border-radius: 999px; padding: 7px 18px; font-weight: 700; }
  /* Beside Send, never instead of it: whether an agent is working is
     evidence, not a fact, and no amount of doubt should leave a person
     unable to speak. */
  .say button.stop { background: none; color: var(--ink); border: 1px solid var(--edge); border-radius: 999px; padding: 6px 14px; }
  .say button.attach { min-width: 36px; min-height: 36px; font-size: 22px; line-height: 1; color: var(--muted); display: inline-flex; align-items: center; justify-content: center; }
  .say button.send:disabled { opacity: 0.4; cursor: default; }
  .say .sent { color: var(--muted); font-size: 12px; min-width: 0; overflow-wrap: anywhere; }

  /* The ledger: a drawer on a phone, a column on a desk. */
  .ledger { display: none; background: var(--bezel); border-left: 1px solid var(--edge); overflow: auto; font-size: 13px; }
  .ledger.open { display: block; position: fixed; inset: 0; z-index: 2; border: 0; }
  .ledger .lhead { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 10px 14px 8px; }
  .ledger .lhead .session { font-family: var(--plate); font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ledger .close { color: var(--muted); }
  .ledger .forget { color: var(--muted); font-size: 12px; margin-left: auto; }
  .ledger .facts { padding: 6px 14px 10px; border-bottom: 1px solid var(--edge); }
  .ledger .facts .plan { font-family: var(--plate); font-weight: 700; }
  .ledger .facts .gate { color: var(--hue); }
  .ledger .facts .line { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .ledger .queue { padding: 2px 14px 8px; border-bottom: 1px solid var(--edge); }
  .ledger .queue:empty { display: none; }
  .ledger .queue .head { color: var(--muted); font-size: 12px; padding: 4px 0; }
  .ledger .queue .q { display: flex; align-items: baseline; gap: 8px; padding: 3px 0; }
  .ledger .queue .q .nm { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ledger .queue .q .pri { flex: 0 0 auto; width: 3.4em; padding: 2px 4px; border: 1px solid var(--edge); border-radius: 3px; background: var(--base); color: var(--muted); font-family: var(--mono); font-size: 12px; text-align: right; }
  .ledger .queue .q button { flex: 0 0 auto; color: var(--muted); font-size: 12px; padding: 2px 4px; }
  .ledger .queue .q button.armed { color: var(--ink); font-weight: 700; }
  .ledger .queue-tools { padding: 5px 14px; border-bottom: 1px solid var(--edge); }
  .ledger .queue-tools button { color: var(--hue); font-size: 12px; }
  .ledger .queue-editor { padding: 10px 14px; border-bottom: 1px solid var(--edge); }
  .ledger .queue-editor[hidden] { display: none; }
  .ledger .queue-editor form { display: grid; gap: 8px; }
  .ledger .queue-editor label { display: grid; gap: 3px; color: var(--muted); font-size: 12px; }
  .ledger .queue-editor label[hidden] { display: none; }
  .ledger .queue-editor input, .ledger .queue-editor textarea { box-sizing: border-box; width: 100%; padding: 6px; border: 1px solid var(--edge); border-radius: 4px; background: var(--base); color: var(--ink); font: 12px var(--mono); }
  .ledger .queue-editor textarea { min-height: 180px; resize: vertical; }
  .ledger .queue-editor .controls { display: flex; gap: 10px; }
  .ledger .stash-list, .ledger .stash-detail { padding: 8px 14px; border-bottom: 1px solid var(--edge); }
  .ledger .stash-list:empty, .ledger .stash-detail[hidden] { display: none; }
  .ledger .stash-list .head { color: var(--muted); font-size: 12px; padding-bottom: 4px; }
  .ledger .stash-list .item { display: flex; align-items: baseline; gap: 8px; padding: 3px 0; }
  .ledger .stash-list .name { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ledger .stash-list .note, .ledger .stash-detail .meta { color: var(--muted); font-size: 12px; }
  .ledger .stash-list button, .ledger .stash-detail button, .ledger .stash-list a, .ledger .stash-detail a { color: var(--hue); font-size: 12px; }
  .ledger .stash-detail .controls { display: flex; gap: 12px; padding: 8px 0; }
  .ledger .stash-detail .controls [hidden], .ledger .stash-detail pre[hidden] { display: none; }
  .ledger .stash-detail button.armed { color: var(--bad, #d05a4a); font-weight: 700; }
  .ledger .stash-detail pre { white-space: pre-wrap; overflow-wrap: anywhere; font: 12px var(--mono); max-height: 45vh; overflow-y: auto; }
  .ledger .stash-detail .why { color: var(--bad, #d05a4a); font-size: 12px; }
  .ledger .team { padding: 8px 14px; border-bottom: 1px solid var(--edge); }
  .ledger .team summary { cursor: pointer; font-family: var(--plate); font-weight: 700; }
  .ledger .team .member { border-top: 1px solid var(--edge); padding: 8px 0; }
  .ledger .team .member summary span { color: var(--muted); font: 12px var(--mono); margin-left: 8px; }
  .ledger .team .member pre { white-space: pre-wrap; overflow-wrap: anywhere; font: 12px var(--mono); margin: 7px 0; }
  .ledger .team .member .binding { color: var(--muted); font: 12px var(--mono); }
  .ledger .team .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; margin: 8px 0; }
  .ledger .team input, .ledger .team select { min-width: 0; padding: 5px; border: 1px solid var(--edge); border-radius: 4px; background: var(--base); color: var(--ink); font: 12px var(--mono); }
  .ledger .team input { flex: 1 1 110px; }
  .ledger .team button { padding: 5px; color: var(--hue-deep); text-decoration: underline; font: 12px var(--mono); }
  .ledger .team button.armed { color: var(--bad, #d05a4a); font-weight: 700; }
  .ledger .team .why { color: var(--bad, #d05a4a); font: 12px var(--mono); overflow-wrap: anywhere; }
  .ledger .team .why.ok { color: var(--muted); }
  .ledger .qwhy { color: var(--bad, #d05a4a); font-size: 12px; padding: 0 14px 8px; }
  .ledger .rows { padding: 6px 0; }
  .row { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 2px 14px; white-space: nowrap; overflow: hidden; }
  .row .main { overflow: hidden; text-overflow: ellipsis; }
  .row .age { color: var(--muted); font-size: 12px; }
  .row.header .main { font-weight: 700; padding-top: 6px; }
  /* A commit that stands for its whole plan says the plan's name, and
     wears the emphasis of the header it replaced — otherwise the name
     reads as an ordinary subject (codex on f99d42a). */
  .row.commit .plan { font-weight: 700; }
  /* EVERY row's glyph, not only a review's -- which is what keeps the
     text after it aligned across commit, review and notice rows.
     Sized for the WIDEST mark, not the narrowest. The box was 1.5em,
     which is one character's allowance; FINISHED's mark is `✓✓`, two
     of them, so it overflowed and sat under the author beside it.
     3em keeps the SAME allowance per character rather than picking a
     number that looked about right -- arithmetic this side of the
     browser can defend, where the actual glyph advance is not. */
  .row .glyph { display: inline-block; width: 3em; }
  /* A row with a page in the site: the name is the link, in its own
     colour, marked only by the underline. */
  .row a { color: inherit; text-decoration: none; border-bottom: 1px dotted var(--muted); }
  .row a:hover, .row a:focus-visible { border-bottom-color: var(--ink); outline: none; }
  .row .sha, .row .author { color: var(--muted); }
  /* A review mark takes the colour of its VERDICT, not the session's.
     `--hue` is set per session state from the script below, so a
     refusal was drawn in whatever the session happened to be -- the
     same green as an approval, or yellow. Every other surface already
     colours these by verdict: the TUI through `verdict_color`, the
     generated site through `.mark-request-changes`.

     The unclassed rule is a BELT, and unreachable today: every review
     row `ledger_row` builds carries a verdict class, and only review
     rows get `.row.review`. It covers a payload whose `verdict_class`

    const opt = e.target.closest('.opt'); if (!opt) return;
    const k = opt.dataset.key;
    selection = k === 'auto' ? { auto: true } : { label: k.slice(4) };
    keepSelection();
    openPicker(false);
    show(target());                        // an explicit pick moves, draft or not
    whoEl.focus();
  });
  document.addEventListener('click', (e) => {
    if (!pickerEl.hidden && !pickerEl.contains(e.target) && !whoEl.contains(e.target)) openPicker(false);
  });
  document.addEventListener('keydown', (e) => {
    if (pickerEl.hidden) return;
    if (e.key === 'Escape') { openPicker(false); whoEl.focus(); return; }
    if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
    const opts = [...pickerEl.querySelectorAll('.opt')];
    const at = opts.indexOf(document.activeElement);
    const next = at < 0 ? opts[0] : opts[(at + (e.key === 'ArrowDown' ? 1 : opts.length - 1)) % opts.length];
    if (next) { next.focus(); e.preventDefault(); }
  });

  // ---- an interruption, while it lasts ----
  function paintStrip() {
    const asks = facts ? facts.ledger.blocks : [];
    const fix = facts && facts.correction;
    if (!asks.length && !fix) { stripEl.hidden = true; stripEl.innerHTML = ''; return; }
    stripEl.hidden = false;
    stripEl.innerHTML = [
      ...asks.map((b) => `${esc(b)}<span class="how">Answer it at the terminal, or with clank block answer.</span>`),
      fix ? `${esc(fix)}<span class="how">${esc(masterLabel() || 'master')}'s to repair.</span>` : '',
    ].filter(Boolean).join('');
  }

  // ---- the agent ----
  function ensureViews(label) {
    if (views.has(label)) return;
    const transcript = document.createElement('div'); transcript.className = 'view transcript'; transcript.innerHTML = '<div class="turns"></div>';
    const terminal = document.createElement('div'); terminal.className = 'view terminal'; terminal.innerHTML = '<div class="term"></div><div class="gone"></div>';
    viewsEl.append(transcript, terminal);
    const term = new Terminal({ cols: 80, rows: 24, disableStdin: true, cursorBlink: false, scrollback: 0, fontFamily: 'ui-monospace, Menlo, "SF Mono", Consolas, monospace', fontSize: 13, allowProposedApi: true, theme: { background: '#1a1917', foreground: '#e8e4dc' } });
    term.open(terminal.querySelector('.term'));
    views.set(label, { transcript, terminal, term });
  }

  function hasTranscript(label) { return !!roster().find((a) => a.label === label)?.transcript; }
  function chatReason(label) {
    if (!label) return heard ? 'No agent is selected.' : 'Waiting for this session to report its agents.';
    const a = roster().find((row) => row.label === label);
    if (!a) return `${label} has left the roster.`;
    return a.chat_unavailable_reason || (a.session
      ? 'Chat history is not available yet.' : 'This agent has no bound session.');
  }
  function closeChatReason() {
    chatReasonEl.hidden = true;
    modeBtns.transcript.setAttribute('aria-expanded', 'false');
  }
  function openChatReason() {

    chatReasonEl.hidden = false;
    modeBtns.transcript.setAttribute('aria-expanded', 'true');
  }
  $('chat-reason-close').addEventListener('click', () => { closeChatReason(); modeBtns.transcript.focus(); });

  document.addEventListener('click', (e) => {
    if (!chatReasonEl.hidden && !chatReasonEl.contains(e.target) && e.target !== modeBtns.transcript) closeChatReason();
  });
  function modeFor(label) {
    const wanted = modes[label] || (hasTranscript(label) ? 'transcript' : 'terminal');
    return wanted === 'transcript' && !hasTranscript(label) ? 'terminal' : wanted;
  }

  // Stop was pressed, and nothing has happened since. Suppression is
  // scoped to the ACTIVITY it stopped — the pane, the incarnation,
  // and how far the transcript had got — and then DERIVED rather than
  // maintained, so both ways a transcript arrives are covered by one
  // rule. Clearing it on the incremental path alone left a reconnect
  // (which resends the whole window) unable to re-arm the button, and
  // a new session in the SAME pane looked like the old one (codex on
  // 210afee).
  const stopped = new Map();
  const grokStop = (label) => roster().some((a) => a.label === label && a.tool === 'grok');
  function stopping(label) {
    const s = stopped.get(label);
    if (!s) return false;
    if (paneOf.get(label) !== s.pane) return false;         // a new pane is new work
    // Grok's first Ctrl+C can clear a draft without cancelling the
    // running turn. Let the person retry after a short pause; only a
    // fresh press sends another key.
    if (grokStop(label) && Date.now() >= s.retryAt) return false;
    const w = agents.get(label);
    if (!w) return true;                                    // no transcript: nothing can say otherwise
    if (w.session !== s.session || w.generation !== s.generation) return false;
    return revisionOf(label) === s.rev;                     // any new activity re-arms
  }
  function syncSend() {
    const p = panes.get(shown && paneOf.get(shown));
    // Not while a file is still arriving — a message is not ready
    // until everything it names is in it — and not while one is
    // already on its way, or finishing an upload would re-open the
    // button and let the same instruction go twice (codex on
    // 37014d0).
    send.disabled = !p || p.closed || pending > 0 || sending > 0;
    stopBtn.hidden = !p || p.closed || stopping(shown);
  }
  function show(label) {
    if (shown !== label || hasTranscript(label)) closeChatReason();
    shown = label;
    if (!chatReasonEl.hidden) chatReasonText.textContent = chatReason(label);
    const mode = label ? modeFor(label) : null;
    for (const [m, btn] of Object.entries(modeBtns)) {
      btn.classList.toggle('on', m === mode);
      btn.disabled = m !== 'transcript' && !label;

    const p = panes.get(label && paneOf.get(label));

  }
  for (const [m, btn] of Object.entries(modeBtns)) btn.addEventListener('click', () => {

    if (!shown) return;

  // Turns are rendered ONCE and updated in place, keyed by id: a
  // repaint that rebuilt them would close every <details> the reader
  // had opened (codex on 056a342). Harness turns are not rendered at
  // all — the adapters mark them so this can be the clean transcript.
  function turnHtml(t) {
    const b = t.body;
    const age = `<span class="age"></span>`;
    if (b.kind === 'text') return `${age}<div class="text prose"></div>`;
    if (b.kind === 'thinking') return `${age}<details><summary>thinking</summary><pre class="text"></pre></details>`;
    if (b.kind === 'image') return `${age}<span class="shots"></span>`;
    return `${age}<details class="tool"><summary><span class="name"></span> <span class="in"></span><span class="pending"></span></summary><pre class="in"></pre><pre class="out"></pre><div class="shots"></div></details>`;
  }
  // An image the transcript carried: the picture on a data URL, the
  // full thing in a new tab; one over the cap named by its size.
  function shotHtml(img) {
    if (img.data == null) return `<span class="unshipped">image, ${mb(img.bytes)} — not shown</span>`;
    const src = `data:${img.media_type};base64,${img.data}`;
    return `<img class="shot" loading="lazy" src="${esc(src)}" alt="pasted image">`;

  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && viewerEl.classList.contains('open')) hideFull(); });

    const k = images.map((i) => (i.data ? i.data.length : 'x') + ':' + i.bytes).join(',');
    if (box.dataset.k === k) return;

  function fillTurn(el, t) {
    const b = t.body;

    if (b.kind === 'text') {

      // `render_markdown` made this markup: raw HTML escaped, every
      // destination checked against an allow-list. A turn from before
      // that existed has no `html`, and falls back to its own text.
      const box = el.querySelector('.text');
      if (b.html) box.innerHTML = b.html; else box.textContent = b.text;
      return;
    }
    if (b.kind === 'thinking') { el.querySelector('.text').textContent = b.text; return; }
    if (b.kind === 'image') { fillShots(el.querySelector('.shots'), [b]); return; }
    el.querySelector('summary .name').textContent = b.name;
    // What the call SAYS it is doing, and the call itself to read. A
    // turn from before those were derived has neither, and falls back
    // to the input it always had, as a prose turn does without html.
    el.querySelector('summary .in').textContent = b.title || b.input.slice(0, 120);
    el.querySelector('summary .pending').textContent = b.output == null ? ' …' : '';
    el.querySelector('pre.in').textContent = b.detail || b.input;
    const out = el.querySelector('pre.out');
    out.textContent = b.output == null ? '' : b.output;
    out.hidden = b.output == null;
    fillShots(el.querySelector('.shots'), b.images || []);
  }
  // A run of tool calls with no prose between them is one row: what
  // was said stays readable, what was DONE is one tap away.
  function slotsOf(turns) {
    const slots = [];
    for (const t of turns) {
      const last = slots[slots.length - 1];
      if (t.body.kind === 'tool' && last && last.tools) last.turns.push(t);
      else slots.push({ tools: t.body.kind === 'tool', turns: [t] });
    }
    return slots;
  }

  // Put `t`'s element in `parent` at `cursor`, making it if it is
  // new. Looked up from `box` rather than `parent` because a turn
  // moves between the top level and a group as its run grows, and
  // rebuilding it would close whatever the reader had opened.
  function placeTurn(box, parent, t, cursor) {
    let el = box.querySelector(`[data-id="${CSS.escape(t.id)}"]`);
    if (!el) {
      el = document.createElement('div');
      el.dataset.id = t.id;
      el.className = `turn ${t.who} ${t.body.kind}`;
      el.innerHTML = turnHtml(t);
      parent.insertBefore(el, cursor);
    } else if (el !== cursor) {
      parent.insertBefore(el, cursor);
    }
    fillTurn(el, t);
    return el.nextElementSibling;
  }

  function placeOutgoing(box, entry, cursor) {
    const id = `out:${entry.id}`;
    let el = box.querySelector(`[data-id="${CSS.escape(id)}"]`);
    if (!el) {
      el = document.createElement('div');
      el.dataset.id = id;
      el.innerHTML = '<div class="text"></div><span class="delivery"></span><button class="retry" type="button">Edit and retry</button><button class="dismiss" type="button">Dismiss</button>';
      box.insertBefore(el, cursor);
    } else if (el !== cursor) {
      box.insertBefore(el, cursor);
    }
    el.className = `turn person outgoing ${entry.state}`;
    el.querySelector('.text').textContent = entry.text;
    el.querySelector('.delivery').textContent = entry.state === 'failed'
      ? `Not sent: ${entry.reason || 'delivery failed'}`
      : entry.state === 'sending' ? 'Sending…'
      : entry.state === 'uncertain' ? 'Delivery unconfirmed after refresh'
      : 'Waiting for Chat history…';
    el.querySelector('.retry').hidden = entry.state !== 'failed';
    el.querySelector('.dismiss').hidden = entry.state === 'sending';
    return el.nextElementSibling;
  }

  viewsEl.addEventListener('click', (e) => {
    const button = e.target.closest('button.retry, button.dismiss');
    if (!button) return;
    const id = button.closest('.turn.outgoing')?.dataset.id?.slice(4);
    const entry = outbox.find((x) => x.id === id && x.agent === shown && x.session === boundSession(shown));
    if (!entry) return;
    if (button.classList.contains('dismiss')) {
      outbox.splice(outbox.indexOf(entry), 1);
      keepOutbox();
      paintTranscript(shown);
      retarget();
      return;
    }
    if (entry.state !== 'failed') return;
    if (input.value && input.value !== entry.text) {
      sentEl.textContent = 'Finish the current draft before retrying';
      return;
    }
    input.value = entry.text;
    resize();
    input.focus();
  });

  function paintTranscript(label) {
    const v = views.get(label); if (!v) return;
    const box = v.transcript.querySelector('.turns');
    const w = agents.get(label);
    const shown = (w ? w.turns : []).filter((t) => t.who !== 'harness');
    const outgoing = outbox.filter((e) => e.agent === label && e.session === boundSession(label));
    if (!shown.length && !outgoing.length) { box.innerHTML = `<div class="turn empty-note"><span class="text">Nothing said yet.</span></div>`; return; }
    if (box.querySelector('.empty-note')) box.innerHTML = '';
    const atBottom = v.transcript.scrollTop + v.transcript.clientHeight >= v.transcript.scrollHeight - 40;
    const keep = new Set();
    let cursor = box.firstElementChild;
    for (const slot of slotsOf(shown)) {
      if (!slot.tools || slot.turns.length === 1) {
        for (const t of slot.turns) { keep.add(t.id); cursor = placeTurn(box, box, t, cursor); }
        continue;
      }
      const key = `g:${slot.turns[0].id}`;
      keep.add(key);
      let g = box.querySelector(`[data-id="${CSS.escape(key)}"]`);
      if (!g) {
        // A wrapper is born closed, and that is wrong twice over.
        //
        // A lone call becoming a run must not take back what the
        // reader is looking at: their opened output would vanish
        // under a closed wrapper (codex on f100b52).
        //
        // And the key is the first member's id, so retention evicting
        // that turn REKEYS the run: a wrapper is replaced mid-read,
        // and asking "is anything inside open" would reopen a run the
        // reader had deliberately closed around an open child (codex
        // on 5d3bf82). A replacement inherits what it replaces; only
        // a genuine lone-call transition consults the call itself.
        const had = slot.turns
          .map((t) => box.querySelector(`[data-id="${CSS.escape(t.id)}"]`))
          .find((el) => el && el.closest('.did'));
        const showing = had
          ? had.closest('.did').open
          : slot.turns.some((t) => {
              const was = box.querySelector(`[data-id="${CSS.escape(t.id)}"]`);
              return !!was?.querySelector('details')?.open;

        g.className = 'did'; g.dataset.id = key;

      } else if (g !== cursor) {
        box.insertBefore(g, cursor);
      }
      const running = slot.turns.some((t) => t.body.output == null);
      g.querySelector('summary').textContent = `${running ? 'Running' : 'Ran'} ${slot.turns.length} commands${running ? '…' : ''}`;
      const members = g.querySelector('.members');
      const mine = new Set();
      let mc = members.firstElementChild;
      for (const t of slot.turns) { mine.add(t.id); mc = placeTurn(box, members, t, mc); }
      for (const el of [...members.children]) if (!mine.has(el.dataset.id)) el.remove();
      cursor = g.nextElementSibling;

    for (const entry of outgoing) {
      keep.add(`out:${entry.id}`);
      cursor = placeOutgoing(box, entry, cursor);
    }
    for (const el of [...box.children]) if (!keep.has(el.dataset.id)) el.remove();

  }

  // ---- panes (terminal mode) ----
  function onPanes(d) {
    paneHeard = true;
    paneOf.clear();
    const seen = new Set();
    for (const meta of d.panes) {
      seen.add(meta.id);
      const prev = panes.get(meta.id);
      panes.set(meta.id, { meta, closed: d.closed.includes(meta.id) || meta.exited });
      paneOf.set(meta.label, meta.id);
      ensureViews(meta.label);
      const v = views.get(meta.label);
      if (!prev || prev.meta.columns !== meta.columns || prev.meta.rows !== meta.rows) v.term.resize(meta.columns || 80, meta.rows || 24);
      v.terminal.classList.toggle('closed', panes.get(meta.id).closed);
      v.terminal.querySelector('.gone').textContent = `${meta.label}'s pane closed`;
    }
    for (const id of [...panes.keys()]) if (!seen.has(id)) panes.delete(id);

    if (facts) paintTeam(facts.agents);
  }
  function onPane(d) {
    const p = panes.get(d.pane_id); if (!p) return;
    views.get(p.meta.label)?.term.write(d.screen);
  }

  // ---- the queue ----
  // Two taps for what cannot be taken back, as the pane asks before it
  // promotes: the first arms the button and says so, the second does
  // it. A redraw disarms, so an action cannot ride a row that moved.
  let armed = null;

  // A status frame arrives for anything — a file changing, an agent
  // speaking — and redrawing rows that did not change would take the
  // priority someone is typing, the button they armed, and the
  // refusal they have not read yet (codex on 22e5fbe).
  let queueDrawn = null;

    armed = null;

      b.classList.remove('armed');
      b.textContent = b.dataset.do;
    }
  }
  function queueWhy(text) {
    queueSaid = text || '';
    paintQueueWhy();
  }
  // Outside the list, because the refusal outlives it: the entry a
  // request was refused FOR is often the one another surface has just
  // taken, and an empty queue is exactly when the reason matters
  // (codex on 66488eb).
  function paintQueueWhy() {
    const box = $('qwhy');
    box.textContent = queueSaid;
    box.hidden = !queueSaid;
  }
  // The page does not edit its own copy of the queue: it asks, and the
  // status frame the change wakes is what redraws it.
  async function askQueue(body) {
    queueWhy('');

      const r = await fetch('/queue', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify(body),
      });
      if (r.ok) return r.status === 200 ? await r.json() : {};
      // A refusal is the repo's answer — the queue moved under the
      // phone, a draft of that name is already there — and saying it
      // is the whole difference from nothing happening.
      const said = await r.json().catch(() => null);
      queueWhy((said && said.why) || 'the queue refused that');
    } catch (err) {
      queueWhy('could not reach clank');
    }

  }
  let editorHandle = null, editorOriginal = '', editorRevision = '';
  $('queue-new').addEventListener('click', () => {
    editorHandle = null;
    editorOriginal = '';
    editorRevision = '';
    $('queue-name').readOnly = false;
    $('queue-priority').closest('label').hidden = false;
    $('queue-name').value = '';
    $('queue-priority').value = '500';
    $('queue-body').value = '';
    $('queue-editor').hidden = false;
    $('queue-name').focus();
  });
  $('queue-cancel').addEventListener('click', () => { $('queue-editor').hidden = true; });

    editorOriginal = source.body;
    editorRevision = source.revision;

    $('queue-priority').closest('label').hidden = true;
    $('queue-name').value = source.name;
    $('queue-priority').value = String(source.priority);
    $('queue-body').value = source.body;
    $('queue-editor').hidden = false;
    $('queue-body').focus();
  }
  $('queue-edit-form').addEventListener('submit', async (e) => {

      queueWhy('a priority is 0 to 999');
      return;

    const body = $('queue-body').value;

      ? await askQueue({ do: 'save', handle: editorHandle, original: editorOriginal, revision: editorRevision, body })

  // What is queued, in the order it will run. Named by its file,

  //

  // in the middle of is carried across that redraw by HANDLE — except
  // for an entry that moved or left, whose pending edit is no longer
  // about anything that is there.
  function paintQueue(queue) {
    const box = $('queue');
    const sig = JSON.stringify(queue);
    if (sig === queueDrawn) return;
    const was = queueDrawn === null ? [] : JSON.parse(queueDrawn);
    const before = new Map(was.map((q) => [q.handle, q.priority]));
    // A half-typed priority belongs to the handle, not to the node
    // that is about to be replaced.
    const typing = {};
    for (const input of box.querySelectorAll('input.pri')) {
      if (input.value !== input.defaultValue) {
        typing[input.closest('.q').dataset.handle] = input.value;
      }
    }
    const held = document.activeElement;
    const focused = held && held.closest && held.closest('.q')
      ? held.closest('.q').dataset.handle
      : null;
    const wasArmed = armed;
    queueDrawn = sig;
    box.innerHTML = queue.length
      ? `<div class="head">queued</div>`
        + queue.map((q) => `<div class="q" data-handle="${esc(q.handle)}">`
          + `<span class="nm">${esc(q.name)}</span>`
          + `<input class="pri" inputmode="numeric" value="${esc(String(q.priority).padStart(3, '0'))}" aria-label="priority of ${esc(q.name)}">`
          + `<button data-edit="source" aria-label="Edit ${esc(q.name)} Markdown">edit</button>`
          + `<button data-do="promote">promote</button>`
          + `<button data-do="unqueue">unqueue</button>`
          + `</div>`).join('')
      : '';

    // An entry still there, unmoved, keeps what was being done to it.
    const settled = (handle) => queue.some(
      (q) => q.handle === handle && before.get(handle) === q.priority,
    );
    for (const [handle, value] of Object.entries(typing)) {
      if (!settled(handle)) continue;
      const input = box.querySelector(`.q[data-handle="${CSS.escape(handle)}"] input.pri`);
      if (input) input.value = value;
    }
    if (wasArmed && settled(wasArmed.split(':')[0])) {
      const [handle, what] = wasArmed.split(':');
      const btn = box.querySelector(`.q[data-handle="${CSS.escape(handle)}"] button[data-do="${what}"]`);
      if (btn) {
        armed = wasArmed;
        btn.classList.add('armed');
        btn.textContent = `${what}?`;
      }
    }
    if (focused && settled(focused)) {
      const input = box.querySelector(`.q[data-handle="${CSS.escape(focused)}"] input.pri`);
      if (input) input.focus();
    }
    paintQueueWhy();
  }

  $('queue').addEventListener('click', (e) => {
    const edit = e.target.closest('button[data-edit]');

  // ---- stashed plans ----

  // ---- the repo team ----
  const reviewKinds = ['commit', 'plan', 'final', 'gate', 'standby'];

  const paneState = (label) => {
    if (!paneHeard) return 'checking pane';

  function teamWhy(message) {

  function paintLibrary() {

  async function loadLibrary() {
    try {

  $('team').addEventListener('toggle', () => { if ($('team').open) loadLibrary(); });
  function paintTeam(agents) {
    const sig = JSON.stringify(agents.map((a) => [a.label, a.role, a.tool, a.invocation, a.session, paneState(a.label)]));
    if (sig === teamDrawn) return;
    teamDrawn = sig;

  // ---- the ledger ----

  function onStatus(d) {
    facts = d.facts;

    const prunedLabels = new Set();
    for (let i = outbox.length - 1; i >= 0; i--) {
      const a = roster().find((r) => r.label === outbox[i].agent);
      if (a && Object.prototype.hasOwnProperty.call(a, 'session') && a.session !== outbox[i].session) {
        prunedLabels.add(outbox[i].agent);

  // ---- the live channel ----
  // A WebSocket, not an EventSource: the accountless tunnel's edge
  // buffers a response body until it completes and so never delivers
  // a stream, while an upgrade's frames come through at once. The
  // frames themselves are unchanged — `event: NAME\ndata: JSON` —
  // so the server side of the feed did not have to move.
  const handlers = { status: onStatus, panes: onPanes, pane: onPane, turns: applyTurns, turn: applyTurn };
  let socket = null, retry = 0, closedForGood = false;

  function deliver(text) {
    const cut = text.indexOf('\n');
    if (cut < 0) return;
    const event = text.slice(0, cut).replace(/^event: /, '');
    const data = text.slice(cut + 1).replace(/^data: /, '').replace(/\n+$/, '');
    const handler = handlers[event];
    if (!handler || !data) return;
    try { handler(JSON.parse(data)); } catch (err) { console.error(event, err); }
  }

  function connect() {
    if (closedForGood) return;
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    socket = new WebSocket(`${proto}//${location.host}/events`);
    socket.onopen = () => { retry = 0; live = true; paintHeader(); paintEmpty(); };
    socket.onmessage = (e) => deliver(e.data);
    // Unlike an EventSource, a socket does not retry itself. A close
    // the door caused — the session revoked or expired — must not be
    // retried forever, so the page asks which before backing off.
    socket.onclose = async () => {
      live = false; paintHeader();
      // A forget ends the session on purpose and does its own
      // navigating; racing it to the sign-in page would arrive with
      // the credential still stored, which signs straight back in.
      // Asked again after the probe, because a probe already in
      // flight when the button was pressed answers 401 either way.
      try {
        if (door.sealed) return;
        const gone = (await fetch('/whoami')).status === 401;
        if (door.sealed) return;
        if (gone) {
          closedForGood = true;
          location.replace('/login');
          return;
        }
      } catch (err) {}
      if (door.sealed) return;
      retry = Math.min(retry + 1, 6);
      setTimeout(connect, Math.min(250 * 2 ** retry, 10000));
    };
    socket.onerror = () => { try { socket.close(); } catch (err) {} };
  }

  // An attachment is a FILE and the message names it: a pane is a
  // keyboard, and bytes cannot be typed. The path lands in the box as
  // TEXT, where it can be read and edited before it is sent — an
  // invisible attachment would hide the one thing that has to be true
  // for this to work, which is that the agent is being asked to go
  // and read something.
  let pending = 0;      // uploads on their way into the box
  let sending = 0;      // messages dispatched and not yet answered
  // One file, one attachment, however it arrived. The button and the
  // clipboard are two ways IN; everything after that — the upload,
  // the path, the hold on the draft, the shut Send — belongs to the
  // file, and writing it twice would mean getting one of those wrong
  // in one of the copies.
  async function attach(file) {
    sentEl.textContent = 'Attaching…';
    pending += 1;
    syncSend();                       // Send waits for it
    try {
      const r = await fetch('/upload', { method: 'POST', headers: { 'content-type': file.type || 'application/octet-stream' }, body: file });
      if (!r.ok) throw new Error(await r.text());
      const { path } = await r.json();
      input.value = input.value ? `${input.value} ${path}` : path;
      resize();
      sentEl.textContent = '';
      input.focus();
    } catch (err) {
      sentEl.textContent = 'Not attached';
      setTimeout(() => { sentEl.textContent = ''; }, 2000);
      console.error(err);
    } finally {
      pending -= 1;
      syncSend();                     // Send was waiting for this
      retarget();                     // and so was the view
    }
  }

  attachBtn.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', () => {
    const file = fileInput.files && fileInput.files[0];
    fileInput.value = '';
    if (file) attach(file);
  });

  // A screenshot is pasted far more often than it is picked out of a
  // file dialog, and the focus is usually in the transcript when it
  // is taken — so the document listens, not the box.
  document.addEventListener('paste', (e) => {
    const board = e.clipboardData;
    if (!board) return;
    // `files` where the browser fills it, `items` where it does not,
    // and never both: a browser that populates each would otherwise
    // attach the same image twice.
    let files = [...(board.files || [])];
    if (!files.length && board.items) {
      files = [...board.items]
        .filter((i) => i.kind === 'file')
        .map((i) => i.getAsFile())
        .filter(Boolean);
    }
    if (!files.length) return;        // a text paste belongs to the browser
    // Claimed HERE, synchronously. After the first await the event is
    // long over and `preventDefault` does nothing.
    e.preventDefault();
    // ONE hold for the whole batch. `attach` releases its own as each
    // file finishes, and a file that FAILS leaves the box empty — so
    // between two pasted images the hold would lapse, the view could
    // follow the turn to another agent, and the second path would
    // land in front of them (codex on d772e3e).
    pending += 1;
    syncSend();
    (async () => {
      try {
        for (const file of files) await attach(file);
      } finally {
        pending -= 1;
        syncSend();
        retarget();
      }
    })();
  });

      if (!r.ok) throw new Error(await r.text());

  form.addEventListener('submit', async (e) => {
    e.preventDefault();

    if (!pid || !text) return;
    // A keyboard can submit a form whose button is disabled.
    if (pending > 0 || sending > 0) {
      sentEl.textContent = pending > 0 ? 'Still attaching' : 'Still sending';
      setTimeout(() => { sentEl.textContent = ''; }, 1500);
      return;
    }
    // The submitted text LEAVES the draft here, at dispatch. It now
    // belongs to the request; the box is the next message. Nothing
    // downstream has to work out which characters were sent — the
    // answer used to be a prefix comparison, and replacing "hi" with
    // "history matters" made it "story matters" (codex on 37014d0).
    input.value = '';
    resize();
    sending += 1;
    const session = boundSession(shownWas);
    let outgoing = null;
    if (hasTranscript(shownWas) && session) {
      outgoing = [...outbox].reverse().find((entry) =>
        entry.agent === shownWas && entry.session === session
        && entry.text === text && entry.state === 'failed'
      );
      if (!outgoing) {
        outgoing = { id: globalThis.crypto?.randomUUID?.() || `${Date.now()}-${Math.random()}`,
          agent: shownWas, session, text, seen: [], state: 'sending', reason: '' };
        outbox.push(outgoing);
      }
      outgoing.seen = priorPeople(shownWas, session, text);
      outgoing.state = 'sending'; outgoing.reason = '';
      keepOutbox();
      paintTranscript(shownWas);
    }
    syncSend();

    send.disabled = true;
    try {
      const r = await fetch('/say', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ pane: pid, text }) });
      if (!r.ok) throw new Error(await r.text());
      if (outgoing && outbox.includes(outgoing)) {
        outgoing.state = 'sent';
        keepOutbox();
        paintTranscript(shownWas);
      }
      // Setting .value fires no input event, so the draft's release
      // has to say so itself.
      const receipt = outgoing && !outgoing.recorded ? 'Sent to pane' : 'Sent';
      sentEl.textContent = receipt;
      setTimeout(() => { if (sentEl.textContent === receipt) sentEl.textContent = ''; }, 1500);
      stopped.delete(shownWas);       // new work: whatever was stopped is not any more
      retarget();
    } catch (err) {
      const recorded = outgoing?.recorded === true;
      if (recorded) {
        // A late transport error cannot undo a turn the transcript
        // already proves the agent received.
        sentEl.textContent = 'Recorded in Chat history';
      } else {
        if (outgoing && outbox.includes(outgoing)) {
          outgoing.state = 'failed';
          outgoing.reason = err.message || String(err);
          keepOutbox();
          paintTranscript(shownWas);
        }
        // It never went, so give it back — in front of anything typed
        // since, which is the order they were written in.
        input.value = input.value ? `${text} ${input.value}` : text;
        resize();
        sentEl.textContent = `Not sent: ${err.message || String(err)}`;
        console.error(err);
      }
    } finally {
      sending -= 1;
      syncSend();
      retarget();
      input.focus();
    }
  });

  $('session').textContent = window.CLANK_SESSION || 'clank';
  connect();
})();
</script>
</body>
</html>
