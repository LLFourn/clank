<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>clank · register a passkey</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #1a1917; color: #e8e4dc; font: 16px/1.5 ui-monospace, "SF Mono", Menlo, monospace; }
  main { width: min(28rem, calc(100vw - 2rem)); padding: 1.5rem; background: #242220; border-radius: 6px; }
  h1 { margin: 0 0 1rem; font-size: 1.1rem; font-weight: 700; }
  label { display: block; margin-bottom: 1rem; color: #8a857c; }
  input { display: block; width: 100%; box-sizing: border-box; margin-top: .25rem; padding: .6rem; border: 1px solid #3a3835; border-radius: 4px; background: #1a1917; color: inherit; font: inherit; }
  button { width: 100%; padding: .75rem; border: 0; border-radius: 4px; background: #e0a458; color: #1a1917; font: inherit; font-weight: 700; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  p { margin: 1rem 0 0; color: #8a857c; }
  p.bad { color: #e07070; }
</style>
</head>
<body>
<main>
  <h1>clank · register this device</h1>
  <label>Name this passkey<input id="name" value="phone" maxlength="40" autocomplete="off"></label>
  <button id="go">Register</button>
  <p id="say">The link this page opened from admits one registration.</p>
</main>
<script>
(() => {
  const say = document.getElementById('say'), go = document.getElementById('go'), name = document.getElementById('name');
  const token = new URLSearchParams(location.search).get('t') || '';
  const dec = s => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0));
  const enc = b => btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  const post = async (path, body) => {
    const r = await fetch(path, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
    if (!r.ok) throw new Error(await r.text());
    return r.status === 204 ? null : r.json();
  };
  if (!window.PublicKeyCredential) { go.disabled = true; say.textContent = 'This browser has no passkey support.'; say.className = 'bad'; }
  if (!token) { go.disabled = true; say.textContent = 'No link token. Open the link the TUI minted.'; say.className = 'bad'; }
  go.addEventListener('click', async () => {
    go.disabled = true; say.className = ''; say.textContent = 'Waiting for your authenticator…';
    try {
      const { id, options } = await post('/register/start', { token, name: name.value.trim() || 'phone' });
      const pk = options.publicKey;
      pk.challenge = dec(pk.challenge);
      pk.user.id = dec(pk.user.id);
      for (const c of pk.excludeCredentials || []) c.id = dec(c.id);
      const cred = await navigator.credentials.create({ publicKey: pk });
      const r = cred.response;
      await post('/register/finish', { id, credential: {
        id: cred.id, rawId: enc(cred.rawId), type: cred.type,
        response: { attestationObject: enc(r.attestationObject), clientDataJSON: enc(r.clientDataJSON), transports: r.getTransports ? r.getTransports() : [] },
        extensions: cred.getClientExtensionResults(),
      } });
      say.textContent = 'Registered. Opening clank…';
      location.replace('/');
    } catch (e) { say.textContent = e.message || String(e); say.className = 'bad'; }
  });
})();
</script>
</body>
</html>
