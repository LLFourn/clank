<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>clank</title>
<link rel="stylesheet" href="__CLANK_BASE_PATH__xterm.css">
<script src="__CLANK_BASE_PATH__xterm.js"></script>
<style>
  /* The face, declared here and served from this binary: the
     stylesheet that used to declare it was fetched from Google, on a
     page that keeps a credential. */
  @font-face {
    font-family: "Martian Mono";
    font-style: normal;
    font-weight: 700;
    font-display: swap;
    src: url("__CLANK_BASE_PATH__plate.woff2") format("woff2");
  }
  :root {
    --base: #faf9f7;
    --bezel: #f1efe9;
    --edge: #e3ded4;
    --ink: #262420;
    --muted: #6a655c;
    /* Navigation and controls keep a fixed palette. Only activity/status
       indicators consume the repository's changing state colour. */
    --accent: #5f5fff;
    --accent-ink: color-mix(in srgb, var(--accent) 58%, #17150f);
    --state-hue: #5f5fff;
    --ok: #2f8f4e;
    --done: #2a7f9e;
    --changes: #c2401f;
    --mono: ui-monospace, Menlo, "SF Mono", Consolas, monospace;
    --text: ui-sans-serif, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --plate: "Martian Mono", var(--mono);
    /* The terminal keeps its own ground at every width: agents choose
       ANSI colours assuming a dark one, and bright-white-on-white is
       not something CSS out here can fix. */
    /* One measure for the reading column and the composer, so the
       two line up. 68ch of proportional text came out at 605px and
       still read narrow beside the reference. */
    --column: 46rem;
    --pane: #1a1917;
    --pane-ink: #e8e4dc;
  }
  * { box-sizing: border-box; }
  /* Hidden means hidden. A `display` rule written for one control
     otherwise reaches every element it matches — a `.say input`
     declaration put the native file picker on screen beside `+`
     (codex on d772e3e) — and two controls here rely on `hidden`. */
  [hidden] { display: none !important; }
  /* A grid item's `min-width: auto` is its CONTENT's minimum, so one
     unshrinkable row — the composer, with its buttons — widens the
     whole column and pushes Send off a 320px screen (codex on
     a757522). Every area here scrolls or truncates internally. */
  body > * { min-width: 0; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--base); color: var(--ink);
    font: 14px/1.5 var(--text);
    display: grid;
    grid-template-rows: auto auto 1fr auto;
    grid-template-columns: 1fr;
    grid-template-areas: "bar" "strip" "agent" "say";
    overflow: hidden;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; text-align: left; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

  /* The header: the shown agent, said once, and what it owes. */
  .bar {
    grid-area: bar; position: relative;
    display: grid; grid-template-columns: minmax(0, 1fr);
    padding: 6px 14px 8px;
  }
  /* The repo, then the agent, on one line: a page about a repo says
     which repo, and two remotes open at once are otherwise identical.
     The project gives way first when the screen is narrow — it is the
     context, the agent is the subject. */
  .bar .ident { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
  .bar .project { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); font-size: 13px; }
  .bar .project::after { content: "/"; margin-left: 8px; opacity: .5; }
  .bar .who { display: inline-flex; align-items: baseline; gap: 7px; padding: 6px 2px 6px 0; margin: -6px 0; min-width: 0; }
  .bar .who .name { font-family: var(--plate); font-weight: 700; font-size: 22px; letter-spacing: -0.02em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar .who .caret { color: var(--muted); font-size: 13px; }
  /* Pinned, with the turn somewhere else: the one thing the header
     cannot say when it is showing a name of your choosing. */
  .bar .who .away { display: none; width: 7px; height: 7px; border-radius: 50%; background: var(--state-hue); animation: breathe 2.4s ease-in-out infinite; }
  .bar .who.elsewhere .away { display: inline-block; }
  .bar .who .tag { color: var(--muted); font-size: 11px; }
  .state { grid-column: 1 / -1; display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; margin-top: 1px; }
  .state .doing { flex: 1 1 auto; min-width: 0; color: var(--muted); font-size: 12px; }
  .doing { display: flex; align-items: baseline; gap: 9px; }
  .doing .said { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .doing .obj { color: var(--ink); }
  .doing .clock { flex: 0 0 auto; font-family: var(--plate); font-weight: 700; color: var(--ink); }
  .state .doing .dot, .picker .doing .dot {
    display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: var(--state-hue); margin-right: 7px; vertical-align: 1px;
    animation: breathe 2.4s ease-in-out infinite;
  }
  .state .modes { grid-column: 1 / -1; min-width: 0; display: flex; gap: 18px; overflow-x: auto; font-size: 13px; padding-top: 6px; }
  .state .modes button { flex: 0 0 auto; min-height: 32px; }
  .state .modes button { color: var(--muted); padding: 2px 0; border-bottom: 2px solid transparent; }
  .state .modes button.on { color: var(--ink); border-bottom-color: var(--ink); }
  .state .modes button:disabled, .state .modes button[aria-disabled="true"] { opacity: 0.4; }
  .state .modes button[aria-disabled="true"] { cursor: help; }
  .chat-reason { position: absolute; top: 100%; right: 8px; z-index: 5; width: min(330px, calc(100vw - 16px)); padding: 12px; background: var(--bezel); border: 1px solid var(--edge); border-radius: 8px; box-shadow: 0 18px 44px rgba(0, 0, 0, .5); font-size: 13px; }
  .chat-reason button { display: block; margin: 9px 0 0 auto; color: var(--accent-ink); text-decoration: underline; }
  @keyframes breathe { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
  @media (prefers-reduced-motion: reduce) { .dot, .away { animation: none; } }

  /* The picker: every agent, and `auto` — whoever's turn it is. */
  .picker {
    position: absolute; top: 100%; left: 0; right: 0; z-index: 4;
    background: var(--bezel); border-top: 1px solid var(--edge); border-bottom: 1px solid var(--edge);
    box-shadow: 0 18px 44px rgba(0, 0, 0, .5);
    max-height: 62vh; overflow: auto;
  }
  .picker .opt { display: block; width: 100%; padding: 9px 14px 10px; border-bottom: 1px solid var(--edge); border-left: 3px solid transparent; }
  .picker .opt:last-child { border-bottom: 0; }
  .picker .opt[aria-selected="true"] { border-left-color: var(--accent); }
  .picker .opt .nm { font-family: var(--plate); font-weight: 700; font-size: 15px; }
  .picker .opt .role { color: var(--muted); font-size: 11px; margin-left: 8px; }
  .picker .opt .doing { color: var(--muted); font-size: 12px; margin-top: 2px; }

  /* An interruption, not chrome: here while it is true, gone after. */
  .strip { grid-area: strip; padding: 9px 14px; background: color-mix(in srgb, var(--accent) 13%, var(--bezel)); border-top: 1px solid var(--edge); border-bottom: 1px solid var(--edge); font-size: 12px; white-space: pre-wrap; max-height: 42vh; overflow-y: auto; }
  .strip .how { display: block; color: var(--muted); margin-top: 3px; }
  .strip .block { margin-bottom: 10px; }
  .strip .block:last-child { margin-bottom: 0; }
  .strip .block-context { color: var(--muted); font-weight: 700; }
  .strip .block-question { margin: 3px 0 6px; }
  .strip textarea { display: block; width: 100%; box-sizing: border-box; min-height: 60px; resize: vertical; font: inherit; color: var(--ink); background: var(--base); border: 1px solid var(--edge); border-radius: 4px; padding: 6px; }
  .strip .block button { margin-top: 6px; padding: 5px 9px; background: var(--accent-ink); color: white; border-radius: 4px; font-weight: 700; }
  .strip .block button:disabled { opacity: .5; }
  .strip .block-error { color: var(--ink); margin-left: 8px; }

  /* One agent. */
  .agent { grid-area: agent; display: grid; grid-template-rows: minmax(0, 1fr); min-height: 0; border-top: 1px solid var(--edge); }
  .views { position: relative; min-height: 0; }
  .plan-view { min-width: 0; min-height: 0; display: grid; grid-template-rows: auto auto auto minmax(0, 1fr); background: var(--base); }
  .plan-view [hidden] { display: none !important; }
  .plan-view .head { display: flex; align-items: center; gap: 12px; padding: 8px 14px; border-bottom: 1px solid var(--edge); }
  .plan-view .head button { flex: 0 0 auto; color: var(--accent-ink); font-weight: 700; }
  .plan-view .head span { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: var(--muted); }
  .plan-view .queue-page-tools { grid-row: 2; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 14px; border-bottom: 1px solid var(--edge); }
  .plan-view .stash-page-tools { grid-row: 2; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 14px; border-bottom: 1px solid var(--edge); }
  .plan-view .stash-page-tools .stash-state { margin-right: auto; color: var(--muted); font-size: 12px; }
  .plan-view .queue-page-tools button, .plan-view .queue-editor button { color: var(--accent-ink); font-weight: 700; }
  .plan-view .stash-page-tools button { color: var(--accent-ink); font-weight: 700; }
  .plan-view .queue-page-tools label { display: flex; align-items: center; gap: 5px; margin-left: auto; font-size: 12px; }
  .plan-view .queue-page-tools input { width: 4em; }
  .plan-view .qwhy { grid-row: 3; padding: 8px 14px; color: var(--bad, #d05a4a); border-bottom: 1px solid var(--edge); }
  .plan-view .stash-why { grid-row: 3; padding: 8px 14px; color: var(--bad, #d05a4a); border-bottom: 1px solid var(--edge); }
  .plan-view iframe, .plan-view .queue-editor, .plan-view .queue-result, .plan-view .stash-result { grid-row: 4; min-height: 0; }
  .plan-view iframe { display: block; width: 100%; height: 100%; border: 0; background: var(--base); }
  .plan-view .queue-editor { overflow: auto; padding: 12px 14px; }
  .plan-view .queue-editor form { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; min-height: 100%; gap: 12px; }
  .plan-view .queue-editor .editor-head, .plan-view .queue-editor .controls { display: flex; flex-wrap: wrap; align-items: end; gap: 12px; }
  .plan-view .queue-editor label { display: grid; gap: 4px; min-width: 0; font-size: 12px; color: var(--muted); }
  .plan-view .queue-editor input, .plan-view .queue-editor textarea { box-sizing: border-box; border: 1px solid var(--edge); border-radius: 4px; background: var(--base); color: var(--ink); padding: 8px; font: 14px var(--mono); }
  .plan-view .queue-editor .editor-main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; min-height: 0; }
  .plan-view .queue-editor .editor-main label { min-height: 0; }
  .plan-view .queue-editor textarea { width: 100%; height: 100%; min-height: 240px; resize: none; }
  .plan-view .queue-editor .preview { min-height: 0; overflow: auto; border: 1px solid var(--edge); padding: 10px; }
  .plan-view .queue-editor .preview strong { display: block; margin-bottom: 10px; color: var(--muted); }
  .plan-view .queue-result, .plan-view .stash-result { padding: 24px; overflow: auto; }
  .management-page { overflow: auto; padding: 18px 24px 40px; }
  .management-page h2 { font-family: var(--plate); font-size: 22px; margin: 0 0 16px; }
  .management-page p { max-width: 58ch; line-height: 1.45; }
  @media (max-width: 700px) {
    .plan-view .queue-editor .editor-main { grid-template-columns: 1fr; grid-template-rows: minmax(260px, 1fr) minmax(240px, 1fr); }
    .plan-view .queue-editor .preview { min-height: 220px; }
  }
  .view { position: absolute; inset: 0; overflow: auto; display: none; }
  .view.on { display: block; }
  .empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--muted); padding: 24px; text-align: center; }

  /* Transcript: turns in a column. The agent's are plain; what the
     person said sits in a block of its own, so who is speaking needs
     no label. How long ago is the one thing worth a mark, at the
     right edge of every turn. */
  .turns { padding: 18px 20px 28px; max-width: var(--column); margin-inline: auto; font-size: 16px; line-height: 1.62; }
  .turn { position: relative; padding: 10px 0; }
  .turn .age { float: right; margin: 4px 0 0 12px; color: var(--muted); font-size: 11px; font-family: var(--mono); }
  /* What the person said is a block of its own, so who is speaking
     needs no label. */
  .turn.person { margin: 14px 0; padding: 12px 14px; background: var(--bezel); border: 1px solid var(--edge); border-radius: 10px; }
  .turn.outgoing { border-style: dashed; }
  .turn.outgoing .text { white-space: pre-wrap; }
  .turn.outgoing .delivery { display: block; margin-top: 6px; color: var(--muted); font: 12px var(--mono); overflow-wrap: anywhere; }
  .turn.outgoing.failed .delivery { color: var(--bad, #d05a4a); }
  .turn.outgoing .retry, .turn.outgoing .dismiss { margin: 6px 12px 0 0; color: var(--accent-ink); font: 12px var(--mono); text-decoration: underline; }
  .turn .text { overflow-wrap: anywhere; }
  .turn.harness .text { color: var(--muted); font-size: 13px; }
  .turn.thinking .text { color: var(--muted); }
  .question-card { margin: 12px 0; padding: 16px; border: 1px solid var(--edge); border-radius: 10px; background: var(--bezel); }
  .question-card .question-caption, .question-card .question-note { color: var(--muted); font-size: 12px; }
  .question-card .question-caption { font-weight: 650; }
  .question-card h3 { margin: 8px 0; font-size: 16px; font-weight: 650; line-height: 1.45; overflow-wrap: anywhere; }
  .question-card .question-header { margin-top: 12px; font-size: 12px; color: var(--muted); }
  .question-card ul { margin: 8px 0 12px; padding-left: 20px; }
  .question-card li { padding: 3px 0; overflow-wrap: anywhere; }
  .question-card .choice-description { color: var(--muted); font-size: 13px; }
  .question-card .question-terminal { margin: 8px 0; padding: 6px 10px; border: 1px solid var(--edge); border-radius: 5px; }
  .question-card .question-terminal:disabled { opacity: .5; cursor: default; }
  .question-card .question-result { margin-top: 8px; font-size: 12px; }
  .question-card .question-result pre { white-space: pre-wrap; overflow-wrap: anywhere; font: 12px var(--mono); }
  .question-answer fieldset { border: 0; padding: 0; margin: 0 0 14px; min-width: 0; }
  .question-answer legend { font-size: 12px; color: var(--muted); max-width: 100%; overflow-wrap: anywhere; }
  .question-answer label { display: flex; align-items: start; gap: 8px; padding: 5px 0; }
  .question-answer label > span { min-width: 0; overflow-wrap: anywhere; }
  .question-answer input[type=radio], .question-answer input[type=checkbox] { flex: 0 0 auto; margin-top: 4px; accent-color: var(--accent-ink); }
  .question-answer textarea, .question-answer input[type=text], .question-answer input[type=password] { display: block; width: 100%; min-width: 0; box-sizing: border-box; padding: 9px; background: var(--base); color: var(--ink); border: 1px solid var(--edge); border-radius: 5px; font: inherit; }
  .question-answer textarea { min-height: 70px; resize: vertical; }
  .question-submit { padding: 7px 12px; background: var(--accent-ink); color: white; border-radius: 6px; margin-bottom: 8px; }
  .question-submit:disabled { opacity: .55; cursor: default; }
  .question-notice { font-size: 12px; overflow-wrap: anywhere; margin-top: 7px; }
  .question-discard { margin-left: 10px; color: var(--accent-ink); text-decoration: underline; font-size: 12px; }

  /* Rendered prose. `render_markdown` is the only thing allowed to
     produce this markup; it escapes raw HTML and refuses a
     destination whose scheme is not on its list. */
  .prose > :first-child { margin-top: 0; }
  .prose > :last-child { margin-bottom: 0; }
  .prose p, .prose ul, .prose ol, .prose blockquote, .prose table { margin: 0 0 0.85em; }
  .prose h1, .prose h2, .prose h3, .prose h4 { margin: 1.4em 0 0.5em; line-height: 1.25; font-weight: 650; }
  .prose h1 { font-size: 1.4em; }
  .prose h2 { font-size: 1.22em; }
  .prose h3 { font-size: 1.08em; }
  .prose h4 { font-size: 1em; }
  .prose ul, .prose ol { padding-left: 1.4em; }
  .prose li { margin: 0.25em 0; }
  .prose blockquote { margin-left: 0; padding: 0.1em 0 0.1em 1em; border-left: 3px solid var(--edge); color: var(--muted); }
  .prose a { color: var(--accent-ink); text-underline-offset: 2px; }
  .prose code { font-family: var(--mono); font-size: 0.86em; background: var(--bezel); border: 1px solid var(--edge); border-radius: 4px; padding: 0.1em 0.32em; }
  .prose pre { margin: 0 0 0.9em; padding: 10px 12px; background: var(--bezel); border: 1px solid var(--edge); border-radius: 8px; overflow-x: auto; }
  .prose pre code { font-size: 0.85em; background: none; border: 0; padding: 0; }
  .prose table { border-collapse: collapse; display: block; overflow-x: auto; }
  .prose th, .prose td { border: 1px solid var(--edge); padding: 4px 9px; text-align: left; }
  .prose hr { border: 0; border-top: 1px solid var(--edge); margin: 1.2em 0; }
  .prose img { max-width: 100%; border-radius: 6px; }

  /* What was DONE, one tap from what was said: a run of tool calls
     with no prose between them is one row. */
  .did { margin: 4px 0 10px; }
  .did > summary, .turn.tool details > summary { cursor: pointer; list-style: none; color: var(--muted); font-family: var(--mono); font-size: 13px; padding: 3px 0; }
  .did > summary::-webkit-details-marker, .turn.tool summary::-webkit-details-marker { display: none; }
  .did > summary::before { content: "▸ "; }
  .did[open] > summary::before { content: "▾ "; }
  .did .members { padding-left: 14px; border-left: 1px solid var(--edge); margin-left: 3px; }
  .turn details summary { cursor: pointer; list-style: none; color: var(--muted); font-family: var(--mono); font-size: 13px; }
  .turn details summary::before { content: "▸ "; }
  .turn details[open] summary::before { content: "▾ "; }
  .turn .tool .name { color: var(--ink); }
  .turn pre { margin: 6px 0 0; padding: 8px 10px; background: var(--bezel); border: 1px solid var(--edge); border-radius: 6px; white-space: pre-wrap; overflow-wrap: anywhere; font-family: var(--mono); font-size: 12px; max-height: 40vh; overflow: auto; }
  /* A picture, as pasted: no wider than the column, no taller than
     most of the screen; the full thing a tap away. */
  .turn .attachment { display: inline-flex; vertical-align: top; flex-direction: column; width: min(280px, 100%); margin: 6px 8px 0 0; }
  .turn .shot-button { width: 100%; height: 180px; display: flex; align-items: center; justify-content: center; padding: 6px; border: 1px solid var(--edge); border-radius: 8px; background: var(--base); color: var(--muted); cursor: zoom-in; overflow: hidden; }
  .turn .shot { width: auto; height: auto; max-width: 100%; max-height: 100%; min-width: 0; min-height: 0; object-fit: contain; }
  .turn .attachment-caption { font-size: 12px; color: var(--muted); margin-top: 4px; height: 2.8em; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .turn .attachment-actions { height: 24px; }
  .turn .image-retry { font-size: 12px; align-self: flex-start; }
  .turn .shots { margin-top: 6px; }
  .turn .unshipped { color: var(--muted); font-size: 12px; }
  /* The full picture, in the page: a browser will not open a data
     URL as a page of its own, so the viewer is ours — natural size,
     scrollable, gone on a tap or Escape. */
  .viewer { position: fixed; border: 0; padding: 16px; width: 100vw; height: 100dvh; max-width: 100vw; max-height: 100dvh; margin: 0; background: rgba(0, 0, 0, .94); color: white; }
  .viewer::backdrop { background: rgba(0, 0, 0, .88); }
  .viewer header { display: flex; align-items: center; gap: 12px; height: 44px; }
  .viewer header span { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .viewer button { flex-shrink: 0; color: white; border: 1px solid #777; border-radius: 6px; background: #222; padding: 7px 12px; }
  .viewer .image-stage { height: calc(100% - 44px); overflow: auto; display: flex; align-items: center; justify-content: center; min-height: 0; }
  .viewer img { display: block; max-width: 100%; max-height: 100%; object-fit: contain; }
  .viewer.zoomed .image-stage { display: block; }
  .viewer.zoomed img { max-width: none; max-height: none; margin: auto; }
  .task-status { color: var(--muted); font-size: 12px; margin: 8px 0; }
  .task-record summary, .call-record summary { color: var(--muted); font-size: 12px; }
  .turn pre[hidden] { display: none; }

  /* Terminal: the pane at its desktop size, in a scroller. */
  .terminal { -webkit-overflow-scrolling: touch; touch-action: pan-x pan-y pinch-zoom; padding: 6px 0 0 6px; background: var(--pane); color: var(--pane-ink); }
  .terminal .term { width: max-content; }
  .terminal .gone { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; color: var(--pane-ink); background: color-mix(in srgb, var(--pane) 78%, transparent); }
  .terminal.closed .gone { display: flex; }

  /* Say something. */
  /* One bubble: what you are writing across the top, what you can do
     with it on the row beneath. A single row made the writing area
     compete with every button for the same line, which is how Send
     ended up off a 320px screen. */
  .say { grid-area: say; padding: 10px 14px calc(12px + env(safe-area-inset-bottom)); background: var(--base); }
  .bubble { max-width: var(--column); margin-inline: auto; background: var(--bezel); border: 1px solid var(--edge); border-radius: 18px; padding: 10px 8px 8px 14px; }
  /* A paragraph, not a search term: it WRAPS and grows downward, and
     the height is set from the script because a textarea has no
     content-sized height of its own. `resize: none` because the
     script owns the height; `overflow-y: auto` only bites once the
     cap is reached. */
  .say #text { display: block; width: 100%; background: none; color: var(--ink); border: 0; padding: 2px 6px 6px 0; font: 16px var(--text); resize: none; overflow-y: auto; line-height: 1.45; }
  .say #text:focus { outline: none; }
  .bubble:focus-within { border-color: color-mix(in srgb, var(--accent) 45%, var(--edge)); }
  .tools { display: flex; align-items: center; gap: 8px; }
  .tools .sent { margin-left: auto; }

    forgetEl.textContent = 'forgetting…';
    let ok = false;
    try { ok = (await fetch(route('/forget'), { method: 'POST' })).ok; } catch (err) {}
    dispatch({ t: 'forgetReply', ok });
  }
  forgetEl.addEventListener('click', async () => {
    if (!web.hosted) return dispatch({ t: 'forget' });
    forgetEl.disabled = true;
    try {
      const reply = await fetch(web.signout, { method: 'POST' });
      if (!reply.ok) throw new Error('sign out refused');
      location.replace(web.login);
    } catch (err) {
      forgetEl.disabled = false;
      forgetEl.textContent = 'could not sign out — try again';
    }
  });

  // The TUI's coarse ladder: seconds under a minute read `now`.
  const coarse = (secs) => { const s = Math.max(0, secs); if (s < 60) return 'now'; if (s < 3600) return Math.floor(s / 60) + 'm'; if (s < 86400) return Math.floor(s / 3600) + 'h'; return Math.floor(s / 86400) + 'd'; };
  const now = () => Math.floor(Date.now() / 1000);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  // ---- state ----
  let facts = null;                         // the status frame's facts
  // Whether a status frame has EVER arrived. Before one has, the page
  // knows nothing about the roster — and a page that has not heard is
  // not a session with no agents in it
  // (a-page-that-has-not-heard-is-not-empty).
  let heard = false;
  const panes = new Map();                  // pane id → { meta, closed }
  const paneOf = new Map();                 // label → pane id
  let paneHeard = false;
  const agents = new Map();                 // label → { session, generation, turns[] }  (mirrors PageModel)
  let nativeWindows = new Map();
  const questionEntries = new Map();         // drafts in this page only, never browser storage
  const views = new Map();                  // label → { transcript: el, terminal: el, term }
  const drafts = new Map();               // unsent text belongs to its selected agent
  let shown = null;                         // the agent on screen
  let live = null;                          // null: never opened; then true/false
  // A browser can refuse storage outright — a private window, blocked
  // site data — and then even READING throws. Remembering which view
  // someone prefers is not worth the whole page.
  const remembered = (key, fallback) => {
    try { return JSON.parse(localStorage.getItem(key) || 'null') ?? fallback; } catch (err) { return fallback; }
  };
  const remember = (key, value) => { try { localStorage.setItem(key, JSON.stringify(value)); } catch (err) {} };
  const modes = remembered('clank.modes', {});
  // A refresh in this tab keeps unconfirmed sends visible. Storage is
  // optional: a browser that refuses it still sends normally.
  const OUTBOX_KEY = 'clank.chat.outbox';
  const outbox = (() => {
    try {
      const saved = JSON.parse(sessionStorage.getItem(OUTBOX_KEY) || '[]');
      return Array.isArray(saved) ? saved.filter((e) =>
        e && typeof e.id === 'string' && typeof e.agent === 'string'
        && typeof e.session === 'string' && typeof e.text === 'string'
        && Array.isArray(e.seen) && ['sending', 'sent', 'failed', 'uncertain'].includes(e.state)
      ).map((e) => ({ ...e, state: e.state === 'sending' ? 'uncertain' : e.state })) : [];
    } catch (err) { return []; }
  })();
  const keepOutbox = () => {
    try { sessionStorage.setItem(OUTBOX_KEY, JSON.stringify(outbox)); } catch (err) {}
  };
  // Auto follows the turn; a pin names one agent. Kept, so a
  // deliberate pin survives a reload and a phone waking up.
  let selection = (() => {
    const s = remembered('clank.selection', null);
    return s && typeof s.label === 'string' ? { label: s.label } : { auto: true };
  })();
  const keepSelection = () => remember('clank.selection', selection);

  // ---- the reducer the server tests (feed.rs PageModel) ----
  // What a turn IS, for telling activity apart. Ids alone would miss
  // a tool's output arriving, and timestamps alone cannot tell two
  // turns in the same second apart — or any turn whose harness sent
  // no timestamp at all (codex on e14c244).
  const mark = (t) => `${t.id}/${t.body.kind}/${(t.body.text || '').length}/${t.body.output == null ? '-' : t.body.output.length}/${(t.body.tasks || []).map(task => task.id + ':' + task.status + ':' + (task.output?.length ?? '-')).join(',')}/${t.body.key || (t.body.images || []).map(image => image.key).join(',')}`;
  const sig = (list) => list.map(mark).join(',');
  // A count of the times an agent's transcript actually CHANGED. An
  // identical replay does not move it, so a deliberate Stop survives
  // being resynced; anything genuinely new does, whatever its clock
  // says.
  const revisionOf = (label) => agents.get(label)?.rev ?? 0;
  const boundSession = (label) => {
    const a = roster().find((r) => r.label === label);
    return a && Object.prototype.hasOwnProperty.call(a, 'session')
      ? a.session : agents.get(label)?.session || null;
  };
  const priorPeople = (label, session, text) => {
    const w = agents.get(label);
    return w && w.session === session
      ? w.turns.filter((t) => t.who === 'person' && t.body.kind === 'text' && t.body.text === text).map((t) => `${w.generation}:${t.id}`)
      : [];
  };
  function reconcileOutbox(label) {
    const w = agents.get(label);
    if (!w || !w.session || w.session !== boundSession(label)) return;
    const claimed = new Set();
    let changed = false;
    for (let i = 0; i < outbox.length; ) {
      const entry = outbox[i];
      if (entry.agent !== label || entry.session !== w.session) { i++; continue; }
      const found = w.turns.find((t) =>
        t.who === 'person' && t.body.kind === 'text' && t.body.text === entry.text
        && !entry.seen.includes(`${w.generation}:${t.id}`) && !claimed.has(t.id)
      );
      if (!found) { i++; continue; }
      claimed.add(found.id);
      entry.recorded = true;
      if (entry.state === 'failed' && shown === label && input.value === entry.text) {
        input.value = '';
        resize();
      }
      if (entry.state === 'failed' && shown === label) sentEl.textContent = 'Recorded in Chat history';
      outbox.splice(i, 1); changed = true;
      // A later identical submission must not claim this same turn
      // on the next replay, after the first entry has been removed.
      for (const later of outbox.slice(i)) {
        if (later.agent === label && later.session === w.session && later.text === found.body.text) {
          later.seen.push(`${w.generation}:${found.id}`);
        }
      }
    }
    if (changed) keepOutbox();
  }

  function applyTurns(d) {
    const was = agents.get(d.agent);
    const changed = !was
      || was.session !== d.session
      || was.generation !== d.generation
      || sig(was.turns) !== sig(d.turns);
    agents.set(d.agent, {
      session: d.session,
      generation: d.generation,
      turns: d.turns.slice(),
      rev: (was?.rev ?? 0) + (changed ? 1 : 0),
    });
    reconcileOutbox(d.agent);
    if (d.agent === shown) { paintTranscript(d.agent); syncSend(); }
  }
  function applyTurn(d) {
    const w = agents.get(d.agent);
    if (!w || w.session !== d.session || w.generation !== d.generation) return;
    const i = w.turns.findIndex((t) => t.id === d.turn.id);
    if (i < 0 || mark(w.turns[i]) !== mark(d.turn)) w.rev = (w.rev ?? 0) + 1;
    if (i >= 0) w.turns[i] = d.turn; else w.turns.push(d.turn);
    if (w.turns.length > 200) w.turns.splice(0, w.turns.length - 200);
    reconcileOutbox(d.agent);
    // After the turn is in, not before: `workingOf` reads the newest
    // one, so asking first would answer about the previous turn.
    if (d.agent === shown) { paintTranscript(d.agent); syncSend(); }
  }

  // ---- who is shown ----
  const roster = () => (facts ? facts.agents : []);
  const masterLabel = () => (roster().find((a) => a.role === 'master') || roster()[0] || {}).label || null;
  // Whoever has been kept waiting longest: the oldest obligation, an
  // undated one last. Equal clocks keep the roster's order — sort is
  // stable — so auto cannot flip between two agents routed in the
  // same instant.
  function upNow() {
    const owing = roster().filter((a) => a.owes);
    if (!owing.length) return null;
    const key = (a) => (a.owes.since == null ? Infinity : a.owes.since);
    return owing.slice().sort((x, y) => key(x) - key(y))[0].label;
  }
  function target() {
    if (!selection.auto) {
      if (roster().some((a) => a.label === selection.label)) return selection.label;
      selection = { auto: true };           // the pinned agent left the roster
      keepSelection();
    }
    const waiting = [...outbox].reverse().find((e) =>
      roster().some((a) => a.label === e.agent && boundSession(a.label) === e.session)
    );
    if (waiting) return waiting.agent;
    return upNow() || masterLabel();
  }
  // The one place the view moves by itself. What is in the say box was
  // typed to whoever is shown, and /say delivers it to whoever is
  // shown: any move under a draft hands the message to the wrong
  // agent. So a draft owns the view until it is sent or cleared —
  // including when the agent it was typed to leaves the roster, where
  // the honest answer is a disabled send button, not a new recipient.
  function retarget() {
    // A draft is the box's text OR an upload on its way into it: the
    // path lands in whatever box exists when the response comes back,
    // so an automatic move mid-upload would attach a photo to the
    // wrong agent (codex on a757522).
    if (input.value !== '' || pending > 0 || sending > 0) return;
    // A submitted message owns the view until the bound transcript
    // records it. Moving as soon as the box empties would hide the
    // pending message the sender is waiting to see.
    if (outbox.some((e) => e.agent === shown && e.session === boundSession(shown) && e.state !== 'failed')) return;
    const want = target();
    if (want !== shown) show(want);
  }
  input.addEventListener('input', retarget);

  // ---- the header ----
  // Two regions, always: the sentence gives way, the clock does not.
  // One shrinking span would take the clock over the edge with it.
  const said = (html) => `<span class="said">${html}</span>`;
  function clause(a) {
    if (!a) return '';
    if (!a.owes) return said(esc(a.last || 'idle'));
    const o = a.owes;
    return said(`<span class="dot"></span>${esc(o.verb)} <span class="obj">${esc(o.object)}</span>`)
      + (o.since != null ? `<span class="clock">${coarse(now() - o.since)}</span>` : '');
  }
  // What the middle of the page says when there is no agent to draw:
  // that nothing has arrived, or that nothing is there — never the
  // second while the first is true.
  function paintEmpty() {
    emptyEl.textContent = heard
      ? 'No agents in this session yet.'
      : 'Waiting for this session…';
    emptyEl.style.display = heard && roster().length ? 'none' : 'flex';
  }
  function paintHeader() {
    // textContent: a repo can be named anything a directory can be.
    const project = facts ? facts.project : '';
    projectEl.textContent = project || '';
    projectEl.hidden = !project;
    // The tab, the bookmark and the home-screen icon all carry this.
    // The session name — the multiplexer's name for a window — is a
    // different question, and stays in the ledger where it is asked.
    document.title = project || 'clank';
    // `no agents` is something only a page that HAS heard can say.
    whoName.textContent = shown || (heard && !roster().length ? 'no agents' : '');
    autoTag.hidden = !selection.auto;
    whoEl.classList.toggle('elsewhere', !selection.auto && roster().some((a) => a.owes && a.label !== shown));
    const a = roster().find((x) => x.label === shown);
    doingEl.innerHTML = live !== true
      ? said(live === null ? 'connecting…' : 'reconnecting…')
      // Connected, and nothing said yet: the socket opening is not
      // the facts arriving.
      : !heard
      ? said('waiting…')
      // A draft can hold the view on an agent that has left; say so,
      // because the send button going quiet is not an explanation.
      : (shown && !a ? said(`${esc(shown)} has left the roster`) : clause(a));
  }

  // ---- the picker ----
  function optHtml(key, name, role, doing, on) {
    return `<button class="opt" role="option" data-key="${esc(key)}" aria-selected="${on}">`
      + `<span class="nm">${esc(name)}</span>${role ? `<span class="role">${esc(role)}</span>` : ''}`
      + `<span class="doing">${doing}</span></button>`;
  }
  function paintPicker() {
    const had = document.activeElement && document.activeElement.closest('.opt');
    const up = upNow() || masterLabel();
    const rows = [optHtml('auto', 'auto', '', said(`follows the turn — ${esc(up || 'nobody')} now`), !!selection.auto)];
    for (const a of roster()) rows.push(optHtml(`pin:${a.label}`, a.label, a.role, clause(a), selection.label === a.label));
    pickerEl.innerHTML = rows.join('');
    if (had) pickerEl.querySelector(`.opt[data-key="${CSS.escape(had.dataset.key)}"]`)?.focus();
  }
  function openPicker(open) {
    pickerEl.hidden = !open;
    whoEl.setAttribute('aria-expanded', open ? 'true' : 'false');
    if (open) { paintPicker(); pickerEl.querySelector('.opt[aria-selected="true"]')?.focus(); }
  }
  whoEl.addEventListener('click', () => openPicker(pickerEl.hidden));
  pickerEl.addEventListener('click', (e) => {
    const opt = e.target.closest('.opt'); if (!opt) return;
    if (!$('plan-view').hidden) closeSitePage(false);
    const k = opt.dataset.key;
    if ((pending > 0 || sending > 0) && (k === 'auto' || k.slice(4) !== shown)) {
      sentEl.textContent = pending > 0 ? 'Finish attaching before switching agents' : 'Finish sending before switching agents';
      return;
    }
    selection = k === 'auto' ? { auto: true } : { label: k.slice(4) };
    keepSelection();
    openPicker(false);
    show(target());                        // each agent keeps its own unsent draft
    whoEl.focus();
  });
  document.addEventListener('click', (e) => {
    if (!pickerEl.hidden && !pickerEl.contains(e.target) && !whoEl.contains(e.target)) openPicker(false);
  });
  document.addEventListener('keydown', (e) => {
    if (pickerEl.hidden) return;
    if (e.key === 'Escape') { openPicker(false); whoEl.focus(); return; }
    if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
    const opts = [...pickerEl.querySelectorAll('.opt')];
    const at = opts.indexOf(document.activeElement);
    const next = at < 0 ? opts[0] : opts[(at + (e.key === 'ArrowDown' ? 1 : opts.length - 1)) % opts.length];
    if (next) { next.focus(); e.preventDefault(); }
  });

  // ---- an interruption, while it lasts ----
  let stripDrawn = null;
  function paintStrip() {
    const asks = facts ? facts.ledger.blocks : [];
    const fix = facts && facts.correction;
    const signature = JSON.stringify([asks, fix]);
    if (signature === stripDrawn) return;
    stripDrawn = signature;
    if (!asks.length && !fix) { stripEl.hidden = true; stripEl.innerHTML = ''; return; }
    stripEl.hidden = false;
    stripEl.innerHTML = [
      ...asks.map((b) => `<form class="block" data-agent="${esc(b.agent)}" data-name="${esc(b.name)}"><div class="block-context">${esc(b.agent)} · ${esc(b.name)}</div><div class="block-question">${esc(b.question)}</div><textarea name="answer" aria-label="Answer ${esc(b.agent)}'s block ${esc(b.name)}" required></textarea><button type="submit">Answer block</button><span class="block-error" role="alert"></span></form>`),
      fix ? `${esc(fix)}<span class="how">${esc(masterLabel() || 'master')}'s to repair.</span>` : '',
    ].filter(Boolean).join('');
  }
  stripEl.addEventListener('submit', async (e) => {
    const form = e.target.closest('form.block'); if (!form) return;
    e.preventDefault();
    const answer = form.elements.answer.value.trim();
    const error = form.querySelector('.block-error');
    if (!answer) { error.textContent = 'Write an answer before submitting.'; return; }
    const { agent, name } = form.dataset;
    const block = facts?.ledger.blocks.find((b) => b.agent === agent && b.name === name);
    if (!block) { error.textContent = 'This block is no longer pending.'; return; }
    const button = form.querySelector('button'); button.disabled = true;
    error.textContent = '';
    try {
      const reply = await fetch(route('/blocks/answer'), { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ agent, name, question: block.question, answer }) });
      if (!reply.ok) {
        const body = await reply.json().catch(() => ({}));
        throw new Error(body.why || `Answer refused (${reply.status})`);
      }
      facts.ledger.blocks = facts.ledger.blocks.filter((b) => b.agent !== agent || b.name !== name);
      stripDrawn = null;
      paintStrip();
    } catch (err) {
      error.textContent = err.message || 'Could not answer the block.';
      button.disabled = false;
    }
  });

  // ---- the agent ----
  function ensureViews(label) {
    if (views.has(label)) return;
    const transcript = document.createElement('div'); transcript.className = 'view transcript'; transcript.innerHTML = '<div class="native-recovery empty-note" hidden><span></span> <button class="native-reconnect" type="button">Reconnect questions</button></div><div class="turns"></div>';
    const terminal = document.createElement('div'); terminal.className = 'view terminal'; terminal.innerHTML = '<div class="term"></div><div class="gone"></div>';
    viewsEl.append(transcript, terminal);
    const term = new Terminal({ cols: 80, rows: 24, disableStdin: true, cursorBlink: false, scrollback: 0, fontFamily: 'ui-monospace, Menlo, "SF Mono", Consolas, monospace', fontSize: 13, allowProposedApi: true, theme: { background: '#1a1917', foreground: '#e8e4dc' } });
    term.open(terminal.querySelector('.term'));
    views.set(label, { transcript, terminal, term });
  }

  function hasTranscript(label) { return !!roster().find((a) => a.label === label)?.transcript; }
  function hasChat(label) { return hasTranscript(label)
    || (nativeWindows.has(label) && nativeWindows.get(label).session===boundSession(label))
    || [...questionEntries.values()].some(e => e.agent===label && e.session===boundSession(label)); }
  function chatReason(label) {
    if (!label) return heard ? 'No agent is selected.' : 'Waiting for this session to report its agents.';
    const a = roster().find((row) => row.label === label);
    if (!a) return `${label} has left the roster.`;
    return a.chat_unavailable_reason || (a.session
      ? 'Chat history is not available yet.' : 'This agent has no bound session.');
  }
  function closeChatReason() {
    chatReasonEl.hidden = true;
    modeBtns.transcript.setAttribute('aria-expanded', 'false');
  }
  function openChatReason() {
    chatReasonText.textContent = chatReason(shown);
    chatReasonEl.hidden = false;
    modeBtns.transcript.setAttribute('aria-expanded', 'true');
  }
  $('chat-reason-close').addEventListener('click', () => { closeChatReason(); modeBtns.transcript.focus(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !chatReasonEl.hidden) closeChatReason(); });
  document.addEventListener('click', (e) => {
    if (!chatReasonEl.hidden && !chatReasonEl.contains(e.target) && e.target !== modeBtns.transcript) closeChatReason();
  });
  function modeFor(label) {
    const wanted = modes[label] || (hasChat(label) ? 'transcript' : 'terminal');
    return wanted === 'transcript' && !hasChat(label) ? 'terminal' : wanted;
  }

  // Stop was pressed, and nothing has happened since. Suppression is
  // scoped to the ACTIVITY it stopped — the pane, the incarnation,
  // and how far the transcript had got — and then DERIVED rather than
  // maintained, so both ways a transcript arrives are covered by one
  // rule. Clearing it on the incremental path alone left a reconnect
  // (which resends the whole window) unable to re-arm the button, and
  // a new session in the SAME pane looked like the old one (codex on
  // 210afee).
  const stopped = new Map();
  const grokStop = (label) => roster().some((a) => a.label === label && a.tool === 'grok');
  function stopping(label) {
    const s = stopped.get(label);
    if (!s) return false;
    if (paneOf.get(label) !== s.pane) return false;         // a new pane is new work
    // Grok's first Ctrl+C can clear a draft without cancelling the
    // running turn. Let the person retry after a short pause; only a
    // fresh press sends another key.
    if (grokStop(label) && !s.uncertain && Date.now() >= s.retryAt) return false;
    const w = agents.get(label);
    if (!w) return true;                                    // no transcript: nothing can say otherwise
    if (w.session !== s.session || w.generation !== s.generation) return false;
    return revisionOf(label) === s.rev;                     // any new activity re-arms
  }
  function syncSend() {
    const p = panes.get(shown && paneOf.get(shown));
    // Not while a file is still arriving — a message is not ready
    // until everything it names is in it — and not while one is
    // already on its way, or finishing an upload would re-open the
    // button and let the same instruction go twice (codex on
    // 37014d0).
    send.disabled = !p || p.closed || pending > 0 || sending > 0;
    stopBtn.hidden = !p || p.closed || stopping(shown);
  }
  function show(label) {
    if (shown !== label) {
      if (shown) drafts.set(shown, input.value);
      input.value = drafts.get(label) || '';
      sentEl.textContent = '';
      resize();
    }
    if (shown !== label || hasChat(label)) closeChatReason();
    shown = label;
    if (!chatReasonEl.hidden) chatReasonText.textContent = chatReason(label);
    const agentMode = label ? modeFor(label) : null;
    const mode = timelineOpen && narrowTimeline.matches ? 'timeline' : workspace || agentMode;
    document.body.classList.toggle('timeline-active', mode === 'timeline');
    for (const [m, btn] of Object.entries(modeBtns)) {
      btn.classList.toggle('on', m === mode);
      btn.setAttribute('aria-selected', String(m === mode));
      btn.tabIndex = m === mode || (!mode && m === 'team') ? 0 : -1;
      btn.disabled = (m === 'terminal' || m === 'settings') && !label;
      if (m === 'transcript') btn.setAttribute('aria-disabled', String(!label || !hasChat(label)));
    }
    for (const [l, v] of views) {
      v.transcript.classList.toggle('on', l === label && !workspace && agentMode === 'transcript');
      v.terminal.classList.toggle('on', l === label && !workspace && agentMode === 'terminal');
    }
    const planOpen = !$('plan-view').hidden;
    viewsEl.setAttribute('role', 'tabpanel');
    viewsEl.setAttribute('aria-labelledby', agentMode === 'terminal' ? 'mode-terminal' : 'mode-transcript');
    viewsEl.tabIndex = 0;
    viewsEl.hidden = !!workspace || planOpen;
    $('team-page').hidden = workspace !== 'team' || planOpen;
    $('settings-page').hidden = workspace !== 'settings' || planOpen;
    form.hidden = !!workspace || planOpen;
    paintSettings();
    paintRoster();
    syncSend();
    input.placeholder = label ? `Say something to ${label}` : 'Say something';
    const p = panes.get(label && paneOf.get(label));
    if (label) { paintTranscript(label); if (p && !p.closed) views.get(label).term.scrollToBottom(); }
    paintHeader();
  }
  for (const [m, btn] of Object.entries(modeBtns)) btn.addEventListener('click', () => {
    if (!$('plan-view').hidden) closeSitePage(false);
    if (m === 'team' || m === 'settings') {
      if (m === 'settings' && shown) { selection = { label: shown }; keepSelection(); }
      workspace = m; timelineOpen = false; closeChatReason(); show(shown);
      if (m === 'team') loadLibrary();
      return;
    }
    if (m === 'timeline') {
      timelineOpen = true;
      closeChatReason();
      show(shown);
      return;
    }
    if (m === 'transcript' && !hasChat(shown)) { openChatReason(); return; }
    if (!shown) return;
    closeChatReason();
    timelineOpen = false;
    workspace = null;
    modes[shown] = m; remember('clank.modes', modes); show(shown);
  });
  document.querySelector('[role="tablist"]').addEventListener('keydown', (e) => {
    if (!['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(e.key)) return;
    const tabs = Object.values(modeBtns).filter((b) => !b.disabled && b.getClientRects().length);
    const at = tabs.indexOf(document.activeElement);
    const next = e.key === 'Home' ? tabs[0] : e.key === 'End' ? tabs.at(-1)
      : tabs[(at + (e.key === 'ArrowRight' ? 1 : tabs.length - 1)) % tabs.length];
    if (next) { e.preventDefault(); next.focus(); next.click(); }
  });
  window.addEventListener('resize', () => {
    if (timelineOpen && !narrowTimeline.matches) { timelineOpen = false; show(shown); }
  });

    let el = box.querySelector(`[data-id="${CSS.escape(t.id)}"]`);
    if (!el) {
      el = document.createElement('div');
      el.dataset.id = t.id;
      el.className = `turn ${t.who} ${t.body.kind}`;
      el.dataset.renderer = renderer;
      el.innerHTML = turnHtml(t);
      parent.insertBefore(el, cursor);
    } else if (el !== cursor) {
      parent.insertBefore(el, cursor);
    }
    if (el.dataset.renderer !== renderer) {
      el.dataset.renderer = renderer;
      el.className = `turn ${t.who} ${t.body.kind}`;
      el.innerHTML = turnHtml(t);
    }
    fillTurn(el, t);
    return el.nextElementSibling;
  }

  function placeOutgoing(box, entry, cursor) {
    const id = `out:${entry.id}`;
    let el = box.querySelector(`[data-id="${CSS.escape(id)}"]`);
    if (!el) {
      el = document.createElement('div');
      el.dataset.id = id;
      el.innerHTML = '<div class="text"></div><span class="delivery"></span><button class="retry" type="button">Edit and retry</button><button class="dismiss" type="button">Dismiss</button>';

  viewsEl.addEventListener('click', (e) => {
    const button = e.target.closest('button.retry, button.dismiss');
    if (!button) return;

  function paintTranscript(label) {
    const v = views.get(label); if (!v) return;
    const recovery=v.transcript.querySelector('.native-recovery'), nativeWindow=nativeWindows.get(label);
    recovery.hidden=!nativeWindow || nativeWindow.session!==boundSession(label) || nativeWindow.available;
    if(!recovery.hidden) {
      recovery.querySelector('span').textContent=(v.recoveryNotice?.owner===nativeWindow.owner ? v.recoveryNotice.message : null) || nativeWindow.reason || 'Native questions are unavailable. Use Terminal or reconnect.';
      recovery.querySelector('button').disabled=!live || nativeWindow.reason?.startsWith('Connecting') || nativeWindow.reason?.startsWith('Reconnecting');
    }
    const box = v.transcript.querySelector('.turns');
    box.dataset.agent = label;
    const w = agents.get(label);
    const shown = questionTurns(label, (w ? w.turns : []).filter((t) => t.who !== 'harness'));
    const outgoing = outbox.filter((e) => e.agent === label && e.session === boundSession(label));
    if (!shown.length && !outgoing.length) { box.innerHTML = `<div class="turn empty-note"><span class="text">Nothing said yet.</span></div>`; pruneImages(); return; }
    if (box.querySelector('.empty-note')) box.innerHTML = '';
    const atBottom = v.transcript.scrollTop + v.transcript.clientHeight >= v.transcript.scrollHeight - 40;
    const keep = new Set();
    let cursor = box.firstElementChild;
    for (const slot of slotsOf(shown)) {
      if (!slot.tools || slot.turns.length === 1) {
        for (const t of slot.turns) { keep.add(t.id); cursor = placeTurn(box, box, t, cursor); }
        continue;
      }
      const key = `g:${slot.turns[0].id}`;
      keep.add(key);
      let g = box.querySelector(`[data-id="${CSS.escape(key)}"]`);
      if (!g) {
        // A wrapper is born closed, and that is wrong twice over.
        //
        // A lone call becoming a run must not take back what the
        // reader is looking at: their opened output would vanish
        // under a closed wrapper (codex on f100b52).
        //
        // And the key is the first member's id, so retention evicting
        // that turn REKEYS the run: a wrapper is replaced mid-read,
        // and asking "is anything inside open" would reopen a run the
        // reader had deliberately closed around an open child (codex
        // on 5d3bf82). A replacement inherits what it replaces; only
        // a genuine lone-call transition consults the call itself.
        const had = slot.turns
          .map((t) => box.querySelector(`[data-id="${CSS.escape(t.id)}"]`))
          .find((el) => el && el.closest('.did'));
        const showing = had
          ? had.closest('.did').open
          : slot.turns.some((t) => {
              const was = box.querySelector(`[data-id="${CSS.escape(t.id)}"]`);
              return !!was?.querySelector('details')?.open;
            });
        g = document.createElement('details');
        g.className = 'did'; g.dataset.id = key;
        g.innerHTML = '<summary></summary><div class="members"></div>';
        g.open = showing;
        box.insertBefore(g, cursor);
      } else if (g !== cursor) {
        box.insertBefore(g, cursor);
      }
      const running = slot.turns.some((t) => t.body.output == null || (t.body.tasks || []).some(task => task.status === 'running'));
      g.querySelector('summary').textContent = `${running ? 'Running' : 'Ran'} ${slot.turns.length} commands${running ? '…' : ''}`;
      const members = g.querySelector('.members');
      const mine = new Set();
      let mc = members.firstElementChild;
      for (const t of slot.turns) { mine.add(t.id); mc = placeTurn(box, members, t, mc); }
      for (const el of [...members.children]) if (!mine.has(el.dataset.id)) el.remove();
      cursor = g.nextElementSibling;
    }
    for (const entry of outgoing) {
      keep.add(`out:${entry.id}`);
      cursor = placeOutgoing(box, entry, cursor);
    }
    for (const el of [...box.children]) if (!keep.has(el.dataset.id)) el.remove();
    pruneImages();
    if (atBottom) v.transcript.scrollTop = v.transcript.scrollHeight;
  }

  // ---- panes (terminal mode) ----
  function onPanes(d) {

      seen.add(meta.id);
      const prev = panes.get(meta.id);
      panes.set(meta.id, { meta, closed: d.closed.includes(meta.id) || meta.exited });
      paneOf.set(meta.label, meta.id);
      ensureViews(meta.label);
      const v = views.get(meta.label);
      if (!prev || prev.meta.columns !== meta.columns || prev.meta.rows !== meta.rows) v.term.resize(meta.columns || 80, meta.rows || 24);
      v.terminal.classList.toggle('closed', panes.get(meta.id).closed);
      v.terminal.querySelector('.gone').textContent = `${meta.label}'s pane closed`;

  $('queue-edit-form').addEventListener('submit', async (e) => {

  // What is queued, in the order it will run. Named by its file,

  // the page, addressed by this exact handle.
  function paintQueue(queue) {
    const box = $('queue');
    const sig = JSON.stringify(queue);
    if (sig === queueDrawn) return;
    const focused = document.activeElement?.closest('.q')?.dataset.handle;
    queueDrawn = sig;
    box.innerHTML = queue.length
      ? `<div class="head">queued</div>`

          + (q.page ? `<a class="nm" title="${esc(q.name)}" href="${esc(siteHref(q.page))}">${esc(q.name)}</a>` : `<span class="nm">${esc(q.name)}</span>`)
          + `<span class="pri" aria-label="priority ${esc(String(q.priority))}">${esc(String(q.priority).padStart(3, '0'))}</span>`

      sentEl.textContent = receipt;
      setTimeout(() => { if (sentEl.textContent === receipt) sentEl.textContent = ''; }, 1500);
      stopped.delete(shownWas);       // new work: whatever was stopped is not any more
      retarget();
    } catch (err) {
      const recorded = outgoing?.recorded === true;
      const uncertain = err.outcomeUnknown || !answered;
      if (recorded) {
        // A late transport error cannot undo a turn the transcript
        // already proves the agent received.
        sentEl.textContent = 'Recorded in Chat history';
      } else if (uncertain) {
        if (outgoing && outbox.includes(outgoing)) {
          outgoing.state = 'uncertain';
          outgoing.reason = err.message || String(err);
          keepOutbox();
          paintTranscript(shownWas);
        }
        sentEl.textContent = 'Delivery unknown — check Chat history before retrying';
        console.error(err);
      } else {
        if (outgoing && outbox.includes(outgoing)) {
          outgoing.state = 'failed';
          outgoing.reason = err.message || String(err);
          keepOutbox();
          paintTranscript(shownWas);
        }
        // It never went, so give it back — in front of anything typed
        // since, which is the order they were written in.
        input.value = input.value ? `${text} ${input.value}` : text;
        resize();
        sentEl.textContent = `Not sent: ${err.message || String(err)}`;
        console.error(err);
      }
    } finally {
      sending -= 1;
      syncSend();
      retarget();
      input.focus();
    }
  });

  $('session').textContent = window.CLANK_SESSION || 'clank';
  connect();
})();
</script>
</body>
</html>
