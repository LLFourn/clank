name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # The it harness reads these and fails ownership checks when one is
  # set. Must equal clank::agent_env::SESSION_IDENTITY_VARS; the
  # ci_workflow gate in crates/cli/tests/it holds it to that.
  SESSION_IDENTITY_VARS: CLAUDE_CODE_SESSION_ID CODEX_THREAD_ID OPENCODE_SESSION_ID GROK_AGENT GROK_SESSION_ID CLANK_AGENT CLANK_BOOTSTRAP_SESSION_ID

defaults:
  run:
    shell: bash

jobs:
  release-entrypoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup toolchain install
      # Deliberately no development cache: a production release build does not
      # provision the maintenance example. One shared build checks that seam.
      - name: Release entry point bootstraps its own tool
        run: bash scripts/check-release-entrypoint.sh

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Provision git, a C compiler and shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends git build-essential shellcheck

      # The OpenCode plugin lifecycle harness fails without node, by design.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the pinned toolchain
        run: |
          rustup toolchain install
          rustc --version
          cargo --version

      - uses: Swatinem/rust-cache@v2

      # The identity unset splits its variable list on purpose.
      - name: actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint" -ignore 'SC2086:'

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Install the pinned licence tools
        run: |
          cargo install cargo-deny --locked --version 0.20.2
          cargo install cargo-about --locked --features cli --version "$(cat scripts/notices/cargo-about.version)"

      - name: cargo deny licences
        run: cargo deny --locked check licenses

      - name: Rust dependency notices are fresh
        # Exercise a symlinked checkout here once, rather than running the
        # entire generator again inside the Rust integration suite.
        run: |
          notice_dir=$(mktemp -d)
          trap 'rm -rf "$notice_dir"' EXIT
          ln -s "$PWD" "$notice_dir/checkout"
          cd "$notice_dir/checkout"
          scripts/notices/check.sh

      - name: clank lib tests
        run: unset $SESSION_IDENTITY_VARS; scripts/test.sh --locked -p clank --lib

      - name: clank integration tests
        run: unset $SESSION_IDENTITY_VARS; scripts/test.sh --locked -p clank --test it

      - name: repository maintenance tests
        run: unset $SESSION_IDENTITY_VARS; scripts/test.sh --locked -p clank --example maintenance

      - name: other crates' tests
        run: unset $SESSION_IDENTITY_VARS; scripts/test.sh --locked --workspace --exclude clank

      - name: Report ignored tests as not run
        if: always()
        run: |
          unset $SESSION_IDENTITY_VARS; scripts/test.sh --locked --workspace --all-targets -- --list --ignored > ignored.txt
          {
            echo "## Ignored tests: NOT run"
            echo
            echo "These \`#[ignore]\` tests are deliberate opt-outs. They did not run in this job and are not counted as passed."
            echo
            echo '```'
            awk '/: test$/ { sub(/: test$/, ""); print }' ignored.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
