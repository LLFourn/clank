[workspace]
members = [".", "frontend", "crates/trinity-core"]

[package]
name = "trinity"
version = "0.2.0"
edition = "2024"
build = "build.rs"

[dependencies]
# Runtime
tokio = { version = "1", features = ["full"] }

# HTTP server + middleware
axum = { version = "0.8", features = ["macros"] }
tower-http = { version = "0.6", features = ["trace", "validate-request", "fs"] }

# CLI
clap = { version = "4", features = ["derive", "env"] }

# MCP
rmcp = { version = "0.10", features = ["server", "transport-io"] }

# File watcher
notify = "8"
notify-debouncer-full = "0.6"

# Templating + frontend
maud = "0.27"

# Hashing
blake3 = "1"

# Path canonicalization
dunce = "1"

# Shared core types (closed-vocab enums, identifiers, response
# DTOs) consumed by daemon and frontend. See
# `.trinity/plans/trinity-core-unification.md`.
trinity-core = { path = "crates/trinity-core" }

# JSON / schemas
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "0.8"

# HTTP client (stdio shim → daemon)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }

# Errors / logging
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Misc
futures = "0.3"
async-stream = "0.3"
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
url = "2"

# SSE plumbing (BroadcastStream)
tokio-stream = { version = "0.1", features = ["sync"] }

# Text diff for plan revisions
similar = "2"

# Embed the Leptos SPA bundle into the daemon binary so there's no
# version-skew between the running daemon and the wasm bundle on
# disk. See `build.rs` and `server::state::Bundle`.
include_dir = "0.7"

[dev-dependencies]
tempfile = "3"
bytes = "1"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
