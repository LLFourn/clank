[workspace]
resolver = "3"
members = ["crates/core", "crates/cli", "crates/web", "crates/web-cloudflare", "crates/user-config"]

[workspace.package]
version = "0.1.0"
license = "0BSD"
repository = "https://github.com/LLFourn/clank"


[workspace.lints.rust]
unsafe_code = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
