[package]
name = "trinity-frontend"
version = "0.0.1"
edition = "2024"
publish = false

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
# leptos_router and leptos_meta land in Phase 2 with multi-page routing.
# Holding them out of the Phase 1 dep tree to keep `cargo build` fast and
# avoid the no-op `nightly` feature on stable toolchains.

# WASM glue
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

# HTTP client for /api/* fetches. gloo-net wraps the browser fetch API.
gloo-net = { version = "0.6", default-features = false, features = ["http"] }

# JSON deserialization for API responses.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Better panic messages in the browser console.
console_error_panic_hook = "0.1"
