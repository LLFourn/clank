[package]
name = "trinity-frontend"
version = "0.0.1"
edition = "2024"
publish = false

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
leptos_router = "0.8"

# WASM glue
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"

# HTTP client for /api/* fetches. gloo-net wraps the browser fetch API.
gloo-net = { version = "0.6", default-features = false, features = ["http"] }

# Shared core types (closed-vocab enums, identifiers, response
# DTOs). See `.trinity/plans/trinity-core-unification.md`.
trinity-core = { path = "../crates/trinity-core" }

# JSON deserialization for API responses.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Browser SSE + Web Audio for the live-update store. Leptos already
# pulls in the rest of web-sys via its own deps.
web-sys = { version = "0.3", features = [
    "EventSource",
    "MessageEvent",
    "AudioContext",
    "AudioContextOptions",
    "AudioDestinationNode",
    "AudioParam",
    "GainNode",
    "OscillatorNode",
    "OscillatorType",
    "Clipboard",
    "Navigator",
    "Performance",
    "Storage",
    "Window",
] }

# Better panic messages in the browser console.
console_error_panic_hook = "0.1"
