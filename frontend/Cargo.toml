[package]
name = "trinity-frontend"
version = "0.0.1"
edition = "2024"
publish = false

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
leptos_router = "0.8"

# WASM glue
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

# HTTP client for /api/* fetches. gloo-net wraps the browser fetch API.
gloo-net = { version = "0.6", default-features = false, features = ["http"] }

# JSON deserialization for API responses.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Better panic messages in the browser console.
console_error_panic_hook = "0.1"
